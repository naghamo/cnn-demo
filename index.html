<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How does a computer see?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Rubik:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#18233D; --muted:#56627A; --line:#CBD3E1;
  --accent:#3346D3; --accent-ink:#FFFFFF; --bar:#3346D3; --bar-bg:#DDE3EE; --map-bg:#000004;
  --display:"Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:17px; line-height:1.5;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
main{max-width:1100px; margin:0 auto; padding:40px 20px 64px}
h1{
  font-family:var(--display); font-weight:800; font-size:clamp(2.6rem, 8vw, 5.2rem);
  line-height:.95; letter-spacing:-.03em; margin:0 0 14px;
}
.lede{font-size:1.15rem; color:var(--muted); margin:0 0 28px; max-width:36ch}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
[hidden]{display:none !important}

.drop{
  border:2px dashed var(--line); border-radius:18px; background:var(--surface);
  padding:28px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
}
.drop.over{border-color:var(--accent)}
.btn{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px;
  padding:13px 24px; font-weight:700; font-size:1.05rem;
}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn:disabled{opacity:.5; cursor:wait}
.drop .hint{color:var(--muted); margin:0; flex:1 1 220px}
#status{margin:14px 2px 0; color:var(--muted); min-height:1.5em}
#status.error{color:#C2263A}


/* results */
.results-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:40px}
.results-head h2{font-family:var(--display); font-weight:800; font-size:2rem; margin:0; letter-spacing:-.02em}
.seg{display:inline-flex; border:2px solid var(--line); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; color:var(--ink); padding:8px 20px; border-radius:999px; font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
#stage3d{
  position:relative; margin-top:16px; height:min(72vh, 660px); min-height:380px;
  border-radius:18px; background:var(--surface); overflow:hidden; touch-action:none;
}
#stage3d canvas{display:block; width:100%; height:100%; cursor:grab}
#stage3d canvas:active{cursor:grabbing}
.howto{color:var(--muted); font-size:.92rem; margin:10px 2px 0}

/* flat view */
.legend{margin:0 0 4px}
.stage{
  display:grid; grid-template-columns: 200px 1fr; gap:24px;
  padding:26px 0; border-top:1px solid var(--line);
}
#flat{margin-top:16px}
.stage h3{font-family:var(--display); font-weight:800; font-size:1.7rem; margin:0; letter-spacing:-.01em; line-height:1.1}
.stage .what{margin:6px 0 4px; font-weight:700}
.stage .size{margin:0; color:var(--muted); font-size:.92rem}
.maps{display:grid; grid-template-columns:repeat(auto-fill, minmax(72px,1fr)); gap:6px}
.maps button{padding:0; border:0; background:var(--map-bg); border-radius:4px; overflow:hidden; aspect-ratio:1; display:block}
.maps canvas{width:100%; height:100%; display:block; image-rendering:pixelated}
.maps button:hover canvas{opacity:.85}
.inputView{width:min(100%, 260px); aspect-ratio:1; border-radius:6px; display:block; background:var(--map-bg)}

/* guess */
#guess{margin-top:36px; padding-top:26px; border-top:1px solid var(--line)}
#guess h2{font-family:var(--display); font-weight:800; font-size:2rem; margin:0 0 16px; letter-spacing:-.02em}
.preds{list-style:none; margin:0; padding:0; display:grid; gap:12px; max-width:560px}
.preds li{display:grid; grid-template-columns: 1fr auto; gap:4px 12px; align-items:baseline}
.preds .name{font-weight:700; font-size:1.1rem}
.preds li:first-child .name{font-family:var(--display); font-size:1.6rem; font-weight:800}
.preds .pct{color:var(--muted); font-variant-numeric:tabular-nums}
.preds .track{grid-column:1/-1; height:10px; border-radius:5px; background:var(--bar-bg); overflow:hidden}
.preds .fill{height:100%; background:var(--bar); border-radius:5px; width:0; transition:width .6s ease}
.note{color:var(--muted); font-size:.92rem; margin:16px 0 0}

dialog{border:0; border-radius:18px; padding:22px; background:var(--surface); color:var(--ink); width:min(92vw, 520px)}
dialog::backdrop{background:rgba(8,12,24,.65)}
.zoom{position:relative; width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--map-bg)}
.zoom canvas{position:absolute; inset:0; width:100%; height:100%}
.dlg-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.dlg-head h3{font-family:var(--display); font-weight:800; font-size:1.4rem; margin:0}
.close{background:transparent; border:2px solid var(--line); color:var(--ink); border-radius:999px; width:40px; height:40px; font-size:1.2rem; line-height:1}
.slider{display:flex; gap:12px; align-items:center; margin-top:14px; color:var(--muted)}
.slider input{flex:1; accent-color:var(--accent)}

/* mode chooser */
.modes{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:0 0 18px; max-width:860px}
.mode{text-align:start; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:18px; padding:16px 18px}
.mode strong{display:block; font-family:var(--display); font-weight:800; font-size:1.4rem; line-height:1.15}
.mode-text > span{display:block; color:var(--muted); font-size:.95rem; margin-top:4px}
.mode[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
/* language switch */
.lang{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; margin:0 0 18px}
.lang button{background:transparent; color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:6px 14px; font-weight:700; font-size:.95rem}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
/* camera */
#cam{margin-top:14px; background:var(--surface); border-radius:18px; padding:14px; max-width:560px}
#cam video{width:100%; border-radius:10px; background:#000; display:block; aspect-ratio:4/3; object-fit:cover}
#cam video.mirror{transform:scaleX(-1)}
#cam .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
/* drawing pad */
#pad{background:var(--surface); border-radius:18px; padding:16px; max-width:420px}
#padCanvas{width:100%; aspect-ratio:1; display:block; background:#000; border-radius:12px; touch-action:none; cursor:crosshair}
#live{font-family:var(--display); font-weight:800; font-size:1.6rem; margin:12px 2px 4px; min-height:1.4em}
.pad-row{display:flex; gap:10px; flex-wrap:wrap}
.age-big{font-family:var(--display); font-weight:800; font-size:clamp(3.4rem, 12vw, 6rem); line-height:1.05; letter-spacing:-.03em; margin:0}
.age-unit{font-size:1.2rem; color:var(--muted); margin:6px 0 0}
.inputView{image-rendering:pixelated}
/* Arabic and Hebrew */
:root[lang="ar"]{--display:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif}
:root[lang="he"]{--display:"Rubik", "Segoe UI", Arial, sans-serif; --body:"Rubik", "Segoe UI", Arial, sans-serif}
:root[lang="ar"] *, :root[lang="he"] *{letter-spacing:0 !important}
:root[lang="ar"] h1, :root[lang="he"] h1{line-height:1.15}
:root[lang="ar"] .age-big{line-height:1.25}
@media (max-width:640px){ .modes{grid-template-columns:1fr} .mode strong{font-size:1.2rem} .mode{padding:12px 14px} }

/* 3D sub-views */
.subview{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px}
.seg.small button{padding:6px 16px; font-size:.95rem}
.btn.small{padding:8px 18px; font-size:.95rem}
#stage3d{margin-top:12px}

.tries-head{font-size:1.05rem; font-weight:700; margin:22px 0 12px; color:var(--muted)}

/* layer switches for the drawing network */
.net-layers{position:absolute; top:12px; inset-inline-end:12px; z-index:2; background:color-mix(in srgb, var(--surface) 90%, transparent); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-size:.85rem; max-height:calc(100% - 24px); overflow:auto}
.net-layers summary{cursor:pointer; font-weight:700}
.net-list{display:grid; gap:4px; margin-top:6px}
.net-layers label{display:flex; gap:6px; align-items:center; cursor:pointer; white-space:nowrap}
.net-layers input{accent-color:var(--accent)}
@media (max-width:640px){ .net-layers{font-size:.75rem; padding:6px 8px; top:8px; inset-inline-end:8px} }

footer a{color:var(--accent); font-weight:700}

/* choose which pattern to follow */
.pick{margin-top:14px}
.pick-label{font-weight:700}
.pick-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
.pick button{display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px; width:96px; border:2px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); transition:border-color .15s ease, transform .15s ease}
.pick button:hover{transform:translateY(-2px)}
.pick button[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent)}
.pick canvas{width:64px; height:64px; display:block; border-radius:8px; image-rendering:pixelated; background:#000}
.pick-name{font-size:.85rem; font-weight:700; text-align:center; line-height:1.2}
.pick-note{color:var(--muted); font-size:.85rem; margin:8px 0 0}

.alone{position:absolute; bottom:14px; inset-inline-start:50%; transform:translateX(-50%); z-index:2; box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[dir="rtl"] .alone{transform:translateX(50%)}

/* drawing: on big screens the pad sits next to the 3D view, so you see it change while you draw */
@media (min-width: 1000px){
  main.drawing{display:grid; grid-template-columns:minmax(300px, 380px) minmax(0, 1fr); column-gap:28px; align-items:start; max-width:1400px}
  main.drawing > *{grid-column:1 / -1}
  main.drawing > #status{order:9}
  main.drawing > #pad{grid-column:1; order:10; position:sticky; top:12px}
  main.drawing > #results{grid-column:2; order:11; min-width:0}
  main.drawing #results .results-head{margin-top:0}
}

/* ---------- icons, header, hero ---------- */
.i{width:20px; height:20px; flex:none}
.btn{display:inline-flex; align-items:center; gap:8px; transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease}
.btn:not(:disabled):hover{transform:translateY(-1px); box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 22%, transparent)}
.btn:not(:disabled):active{transform:translateY(0)}
.seg button{display:inline-flex; align-items:center; gap:6px}
.seg .i{width:17px; height:17px}
.top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 22px}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; color:var(--muted); font-size:.95rem}
.logo{width:30px; height:30px; flex:none}
.top .lang{margin:0; align-items:center}
.top .lang > .i{color:var(--muted); margin-inline-end:2px}
.hero{display:grid; grid-template-columns:1fr auto; align-items:center; gap:24px}
.hero-art{width:min(40vw, 432px); height:auto; display:block}
:root[dir="ltr"] .hero-art{transform:scaleX(-1)}
@media (max-width:760px){ .hero{grid-template-columns:1fr} .hero-art{width:min(92vw, 400px); margin:0 0 6px} }
.mode{display:flex; align-items:center; gap:14px; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.mode:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(20,24,60,.10)}
.mode .mode-icon{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; flex:none; margin:0; padding:0;
  background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); transition:background-color .15s ease, color .15s ease}
.mode .mode-icon .i{width:26px; height:26px; display:block}
.mode[aria-pressed="true"] .mode-icon{background:var(--accent); color:var(--accent-ink)}
.mode-text{display:block; min-width:0}
.results-head h2, #guess h2{display:flex; align-items:center; gap:10px}
.h-i{width:28px; height:28px; color:var(--accent)}
/* status line with a small light: green = ready, yellow = working, red = problem */
#status{display:flex; align-items:center; gap:10px}
#status::before{content:""; width:10px; height:10px; border-radius:50%; background:#22C55E; flex:none; box-shadow:0 0 0 4px color-mix(in srgb, #22C55E 20%, transparent)}
#status.busy::before{background:#F5B300; box-shadow:0 0 0 4px color-mix(in srgb, #F5B300 25%, transparent); animation:pulse 1s ease-in-out infinite}
#status.error::before{background:#E5484D; box-shadow:0 0 0 4px color-mix(in srgb, #E5484D 22%, transparent)}
@keyframes pulse{50%{transform:scale(.6); opacity:.6}}
/* results appear softly */
#results:not([hidden]){animation:rise .35s ease both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.f-row{display:flex; align-items:center; gap:8px}
.f-row .i{width:16px; height:16px; color:var(--muted)}
.drop{transition:border-color .15s ease, background-color .15s ease}
@media (prefers-reduced-motion: reduce){ .btn, .mode, .mode-icon{transition:none} .mode:hover, .btn:hover{transform:none} #status.busy::before, #results:not([hidden]){animation:none} }

/* magnifying glass on the title */
.title-wrap{position:relative}
.title-wrap h1{cursor:none}
@media (hover: none), (pointer: coarse){ .title-wrap h1{cursor:auto} .lens{display:none} }
.lens{position:absolute; left:0; top:0; width:144px; height:144px; pointer-events:none; z-index:3; opacity:0; transform:scale(.6); transition:opacity .18s ease, transform .18s ease}
.lens.on{opacity:1; transform:scale(1)}
.lens-glass{position:absolute; inset:0; border-radius:50%; overflow:hidden; background:var(--bg); border:6px solid #FFC83D; box-shadow:0 10px 28px rgba(20,24,60,.25), inset 0 0 0 2px rgba(255,255,255,.6)}
.lens-in{position:absolute; left:0; top:0; transform-origin:0 0; margin:0; white-space:normal}
.lens-handle{position:absolute; width:16px; height:58px; border-radius:8px; background:#2B1748; right:2px; bottom:-40px; transform:rotate(-45deg); transform-origin:top center}
:root[dir="rtl"] .lens-handle{right:auto; left:2px; transform:rotate(45deg)}
/* how it works in 3 steps */
.how{list-style:none; padding:0; margin:6px 0 22px; display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.how li{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px 7px 8px; font-weight:700; font-size:.95rem}
:root[dir="rtl"] .how li{padding:7px 8px 7px 14px}
.how li .i{width:18px; height:18px; color:var(--accent)}
.how-n{width:24px; height:24px; border-radius:50%; background:#FFC83D; color:#1E1433; display:grid; place-items:center; font-size:.8rem; font-weight:800; flex:none}
.how li:not(:last-child)::after{content:"→"; color:var(--muted); font-weight:800; margin-inline-start:6px}
:root[dir="rtl"] .how li:not(:last-child)::after{content:"←"}
@media (max-width:640px){ .how{flex-direction:column; align-items:stretch} .how li::after{display:none} }
/* drag hint on the 3D view */
.drag-hint{position:absolute; inset-inline-start:14px; bottom:14px; z-index:2; display:flex; align-items:center; gap:8px; background:#1E1433; color:#fff; border-radius:999px; padding:8px 14px; font-weight:700; font-size:.9rem; pointer-events:none; animation:hint 1.6s ease-in-out infinite}
.drag-hint .i{width:18px; height:18px}
@keyframes hint{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){ .drag-hint{animation:none} }

/* the changing picture next to the title */
.hero-art .px, .hero-art .ox{transition:fill .4s ease, opacity .4s ease}
:root[dir="ltr"] .hero-art .pic{transform:scaleX(-1); transform-box:fill-box; transform-origin:center}

.hero-art .guess{transform-box:fill-box; transform-origin:center}
.hero-art .guess.pop{animation:guesspop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes guesspop{from{transform:scale(.4)} to{transform:scale(1)}}
:root[dir="ltr"] .hero-art .guess{transform:scaleX(-1)}
:root[dir="ltr"] .hero-art .guess.pop{animation:guesspop-ltr .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes guesspop-ltr{from{transform:scaleX(-1) scale(.4)} to{transform:scaleX(-1) scale(1)}}
@media (prefers-reduced-motion: reduce){ .hero-art .guess.pop{animation:none} }

/* start screen: only the three choices, a bit bigger; the tools slide in after a choice */
main:not(.picked) .modes{margin-top:8px}
main:not(.picked) .mode{padding:22px 20px}
#drop:not([hidden]), #pad:not([hidden]), #lede:not([hidden]){animation:rise .35s ease both}

/* "Smile!" on the camera, in the age mode */
.cam-view{position:relative}
.smile{position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#FFC83D; color:#1E1433; font-family:var(--display); font-weight:800; font-size:1.5rem; padding:6px 18px; border-radius:999px; box-shadow:0 6px 16px rgba(0,0,0,.2); animation:smilepop 1.4s ease-in-out infinite}
@keyframes smilepop{50%{transform:translateX(-50%) scale(1.08)}}
@media (prefers-reduced-motion: reduce){ .smile{animation:none} }

/* example pictures */
.samples{flex-basis:100%}
.samples-label{font-weight:700; color:var(--muted); font-size:.95rem}
.samples-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.samples button{display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px; width:92px; border:2px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); transition:border-color .15s ease, transform .15s ease}
.samples button:not(:disabled):hover{transform:translateY(-2px); border-color:var(--accent)}
.samples button:disabled{opacity:.5; cursor:wait}
.sample-thumb{width:72px; height:72px; border-radius:10px; background:var(--bg) center/cover no-repeat; display:grid; place-items:center; color:var(--accent)}
.sample-thumb .i{width:34px; height:34px}
.sample-name{font-size:.82rem; font-weight:700; text-align:center; line-height:1.2}

footer{max-width:1100px; margin:0 auto; padding:24px 20px 40px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line)}
footer p{margin:4px 0}

@media (max-width:640px){
  main{padding-top:28px}
  .stage{grid-template-columns:1fr; gap:12px}
  .maps{grid-template-columns:repeat(4, 1fr)}
  #stage3d{height:68vh}
}
@media (prefers-reduced-motion: reduce){ .preds .fill{transition:none} }
</style>

<body>
<main>
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 28 28" aria-hidden="true" focusable="false"><rect x="1" y="1" width="7.5" height="7.5" rx="2" fill="var(--accent)" opacity="1"/><rect x="10" y="1" width="7.5" height="7.5" rx="2" fill="var(--accent)" opacity="0.55"/><rect x="19" y="1" width="7.5" height="7.5" rx="2" fill="#FFC83D" opacity="1"/><rect x="1" y="10" width="7.5" height="7.5" rx="2" fill="var(--accent)" opacity="0.55"/><rect x="10" y="10" width="7.5" height="7.5" rx="2" fill="#FFC83D" opacity="1"/><rect x="19" y="10" width="7.5" height="7.5" rx="2" fill="var(--accent)" opacity="0.55"/><rect x="1" y="19" width="7.5" height="7.5" rx="2" fill="#FFC83D" opacity="1"/><rect x="10" y="19" width="7.5" height="7.5" rx="2" fill="var(--accent)" opacity="0.55"/><rect x="19" y="19" width="7.5" height="7.5" rx="2" fill="var(--accent)" opacity="1"/></svg><span data-i18n="brand">Data Science &amp; Engineering</span></div>
    <div class="lang" role="group" aria-label="Language">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>

// MobileNet v1 has 28 layers. rf = how many input pixels one square "sees".
const OBJ_STAGES = [
  // MobileNet v1 has 28 layers: 1 normal convolution, 13 pairs (depthwise + pointwise), and 1 final layer.
  // ln = the real layer number. rf = how many input pixels one square can see (computed from the layer sizes).
  {name:'conv1_relu',      n:1, ln:1,  total:28, wkey:'whatObj', wi:0, rf:3},
  {name:'conv_pw_1_relu',  n:2, ln:3,  total:28, wkey:'whatObj', wi:1, rf:7},
  {name:'conv_pw_3_relu',  n:3, ln:7,  total:28, wkey:'whatObj', wi:2, rf:19},
  {name:'conv_pw_5_relu',  n:4, ln:11, total:28, wkey:'whatObj', wi:3, rf:43},
  {name:'conv_pw_11_relu', n:5, ln:23, total:28, wkey:'whatObj', wi:4, rf:219},
  {name:'conv_pw_13_relu', n:6, ln:27, total:28, wkey:'whatObj', wi:5, rf:315}
];
const DRAW_STAGES = [
  // the drawing network: conv, max, conv, max, conv, connected, answer = 7 layers
  {name:'c1', n:1, ln:1, total:7, type:'conv', wkey:'whatDraw', wi:0, rf:3},
  {name:'p1', n:2, ln:2, total:7, type:'pool', wkey:'whatDraw', wi:1, rf:4},
  {name:'c2', n:3, ln:3, total:7, type:'conv', wkey:'whatDraw', wi:2, rf:8},
  {name:'p2', n:4, ln:4, total:7, type:'pool', wkey:'whatDraw', wi:3, rf:10},
  {name:'c3', n:5, ln:5, total:7, type:'conv', wkey:'whatDraw', wi:4, rf:18},
  {name:'fc', n:6, ln:6, total:7, type:'fc',   wkey:'whatDraw', wi:5, rf:999}
  // layer 7 of 7 is the answer itself (the bars at the end)
];

const LUT = (() => {
  const stops = [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]];
  const lut = new Uint8ClampedArray(256*3);
  for (let i = 0; i < 256; i++) {
    const t = i/255*(stops.length-1), k = Math.min(Math.floor(t), stops.length-2), f = t-k;
    for (let j = 0; j < 3; j++) lut[i*3+j] = stops[k][j] + (stops[k+1][j]-stops[k][j])*f;
  }
  return lut;
})();

/* ---------------- object network ---------------- */
async function loadObjModel(){
  for (const url of MODEL_URLS) {
    try { return await tf.loadLayersModel(url); }
    catch (e) { console.warn('Could not load', url, e); }
  }
  throw new Error('No model could be loaded');
}

function pickStages(model){
  const names = new Set(model.layers.map(l => l.name));
  let s = OBJ_STAGES.filter(st => names.has(st.name));
  if (s.length >= 3) return s;
  const relus = model.layers.filter(l => /relu/i.test(l.name) && Array.isArray(l.outputShape) && l.outputShape.length === 4);
  const n = Math.min(6, relus.length);
  s = [];
  for (let i = 0; i < n; i++) {
    const l = relus[Math.round(i*(relus.length-1)/Math.max(1, n-1))];
    s.push({name:l.name, n:i+1, wkey:null, wi:null, rf:null});
  }
  return s;
}

async function initObjects(){
  try {
    if (typeof tf === 'undefined') throw new Error('TensorFlow.js did not load');
    const model = await loadObjModel();
    objStages = pickStages(model);
    const outputs = objStages.map(st => model.getLayer(st.name).output);
    outputs.push(model.outputs[0]);
    objModel = tf.model({inputs: model.inputs, outputs});
    tf.tidy(() => { objModel.predict(tf.zeros([1, SIZE, SIZE, 3])); });
    if (appMode === 'obj') { readyStatus(); setButtons(true); }
  } catch (e) {
    console.error(e);
    if (appMode === 'obj') setStatus(t('sLoadFail'), true);
  }
}

function squareCrop(src, w, h){
  const c = document.createElement('canvas');
  c.width = c.height = SIZE;
  const s = Math.min(w, h);
  c.getContext('2d').drawImage(src, (w-s)/2, (h-s)/2, s, s, 0, 0, SIZE, SIZE);
  return c;
}
function fullCanvas(src, w, h, maxSide = 1024){
  const k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function handleImage(src, w, h){
  if (appMode === 'obj') runObjects(squareCrop(src, w, h));
  else runAge(fullCanvas(src, w, h));
}

function loadFile(file){

}

  g.fillStyle = '#111'; g.beginPath(); g.arc(70, 168, 42, 0, Math.PI*2); g.fill();

/* ---------------- shared helpers ---------------- */
function drawMap(canvas, act, ch){
  const {data, h, w, c} = act;
  canvas.width = w; canvas.height = h;
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < h*w; i++) { const v = data[i*c+ch]; if (v < min) min = v; if (v > max) max = v; }
  const range = (max - min) || 1;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < h*w; i++) {
    const k = Math.round((data[i*c+ch]-min)/range*255)*3;
    img.data[i*4] = LUT[k]; img.data[i*4+1] = LUT[k+1]; img.data[i*4+2] = LUT[k+2]; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function strongestChannels(act, n){
  const {data, h, w, c} = act;
  const sums = new Float64Array(c);
  for (let i = 0; i < h*w; i++) { const o = i*c; for (let ch = 0; ch < c; ch++) sums[ch] += data[o+ch]; }
  return Array.from(sums.keys()).sort((a,b) => sums[b]-sums[a]).slice(0, Math.min(n, c));
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const nice = s => s.charAt(0).toUpperCase() + s.slice(1);

async function startRun(){

  busy = true; setButtons(false);
  setStatus(t('sThinking'));
  await new Promise(r => requestAnimationFrame(r));
  return true;
}
function endRun(){ busy = false; setButtons(true); }

/* ---------------- run: what is it? ---------------- */
async function runObjects(inputCanvas){
  if (!objModel || !(await startRun())) return;
  try {
    const outs = tf.tidy(() => {
      const x = tf.browser.fromPixels(inputCanvas).toFloat().div(127.5).sub(1).expandDims(0);
      return objModel.predict(x);
    });
    const list = Array.isArray(outs) ? outs : [outs];
    const acts = list.slice(0, -1).map(t => ({data:t.dataSync(), h:t.shape[1], w:t.shape[2], c:t.shape[3]}));
    const probs = list[list.length-1].dataSync();
    tf.dispose(list);
    const top = Array.from(probs.keys()).sort((a,b) => probs[b]-probs[a]).slice(0, 5);
    await showResults({
      kind: 'obj', acts, stages: objStages, netSize: SIZE, inputCanvas,
      chans: acts.map(a => strongestChannels(a, MAPS_PER_LAYER)),
      guess: {probs, top}
    });
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}

/* ---------------- run: how old? ---------------- */
// Records every convolution the face network runs, so we can show its real layers.
async function captureAgeNet(faceCanvas){
  const ftf = faceapi.tf;
  const eng = ftf.engine();
  const orig = eng.runKernel;
  const ops = [];
  let inside = false;
  const CONV = new Set(['Conv2D', 'FusedConv2D', 'DepthwiseConv2dNative', 'FusedDepthwiseConv2D']);
  const POOL = new Set(['MaxPool', 'AvgPool']);
  eng.runKernel = function(name, inputs, attrs){
    const out = orig.call(this, name, inputs, attrs);
    if (!inside && (CONV.has(name) || POOL.has(name))) {
      inside = true;
      try {
        const t = Array.isArray(out) ? out[0] : out;
        const x = inputs && inputs.x;
        if (t && t.rank === 4 && x && x.rank === 4) {
          let k = 1;
          if (CONV.has(name) && inputs.filter) k = inputs.filter.shape[0];
          if (POOL.has(name) && attrs) k = Array.isArray(attrs.filterSize) ? attrs.filterSize[0] : (attrs.filterSize || 1);
          const op = {name, k, inW: x.shape[2], outW: t.shape[2], conv: CONV.has(name)};
          if (op.conv) op.t = ftf.keep(ftf.relu(t));
          ops.push(op);
        }
      } finally { inside = false; }
    }
    return out;
  };
  let pred;
  try { pred = await faceapi.nets.ageGenderNet.predictAgeAndGender(faceCanvas); }
  finally { eng.runKernel = orig; }
  if (Array.isArray(pred)) pred = pred[0];

  // How much of the face each square can see (grows layer by layer)
  const netSize = ops.length ? ops[0].inW : FACE_NET_SIZE;
  let rf = 1;
  for (const op of ops) { rf += (op.k - 1) * (netSize / op.inW); op.rf = rf; }

  const convs = ops.filter(o => o.conv);
  const n = Math.min(6, convs.length);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(Math.round(i * (convs.length - 1) / Math.max(1, n - 1)));
  const acts = [], stages = [];
  picked.forEach((ci, j) => {
    const t = convs[ci].t;
    acts.push({data: t.dataSync(), h: t.shape[1], w: t.shape[2], c: t.shape[3]});
    stages.push({n: j + 1, ln: ci + 1, total: convs.length + 1, wkey: 'whatAge', wi: Math.round(j * 5 / Math.max(1, n - 1)), rf: convs[ci].rf});
  });
  convs.forEach(o => o.t.dispose());
  return {age: pred ? pred.age : NaN, acts, stages, netSize};
}

async function runAge(srcCanvas){
  if (!faceLoaded || !(await startRun())) return;
  try {
    setStatus(t('sLookingFace'));
    const det = await faceapi.detectSingleFace(srcCanvas, new faceapi.TinyFaceDetectorOptions({inputSize: 416, scoreThreshold: 0.4}));
    if (!det) { setStatus(t('sNoFace'), true); return; }
    const b = det.box;
    const side = Math.max(b.width, b.height) * 1.15;
    const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    const face = document.createElement('canvas');
    face.width = face.height = SIZE;
    const g = face.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, SIZE, SIZE);
    g.drawImage(srcCanvas, cx - side / 2, cy - side / 2, side, side, 0, 0, SIZE, SIZE);
    setStatus(t('sThinking'));
    const r = await captureAgeNet(face);
    if (!isFinite(r.age) || !r.acts.length) throw new Error('No age result');
    const tries = await ageTries(face, r.age);
    await showResults({
      kind: 'age', acts: r.acts, stages: r.stages, netSize: r.netSize, inputCanvas: face,
      chans: r.acts.map(a => strongestChannels(a, MAPS_PER_LAYER)),
      guess: tries
    });
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}

// The age reader answers with one number, not a list of chances.
// To show how sure it is, we give it 20 slightly changed copies of the face and count its answers.
const AGE_TRIES = 20;
async function ageTries(face, firstAge){
  const variants = [];
  for (const flip of [false, true]) for (const s of [1, 0.92, 1.08]) for (const [dx, dy] of [[0, 0], [8, 0], [-8, 0], [0, 8], [0, -8]]) variants.push({flip, s, dx, dy});
  const picked = variants.filter((v, i) => i % 3 !== 2).slice(0, AGE_TRIES - 1);
  const ages = [Math.round(firstAge)];
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d');
  for (const v of picked) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#000'; g.fillRect(0, 0, SIZE, SIZE);
    g.translate(SIZE / 2 + v.dx, SIZE / 2 + v.dy);
    g.scale(v.flip ? -v.s : v.s, v.s);
    g.drawImage(face, -SIZE / 2, -SIZE / 2);
    let p = await faceapi.nets.ageGenderNet.predictAgeAndGender(c);
    if (Array.isArray(p)) p = p[0];
    if (p && isFinite(p.age)) ages.push(Math.round(p.age));
  }
  const counts = new Map();
  ages.forEach(a => counts.set(a, (counts.get(a) || 0) + 1));
  const mean = ages.reduce((x, y) => x + y, 0) / ages.length;
  const list = [...counts.entries()].sort((a, b) => b[1] - a[1] || Math.abs(a[0] - mean) - Math.abs(b[0] - mean));
  const ageList = list.map(([a]) => a);
  const probs = list.map(([, n]) => n / ages.length);
  return {age: ageList[0], ageList, probs, top: probs.map((_, i) => i).slice(0, 6), tries: ages.length};
}

function buildFlat(){
  const {acts, chans, inputCanvas, stages, kind} = current;
  const flat = $('flat');
  flat.innerHTML = '';
  const inp = stageShell(inputTitle(kind), '', t('pixels', {n: current.netSize}));

  acts.forEach((a, s) => {
    const st = stages[s];
    const sizeText = st.type === 'pool' ? t('poolSize', {w: a.w, h: a.h}) : st.type === 'fc' ? t('fcSize') : t('stageSize', {w: a.w, h: a.h, c: a.c, k: chans[s].length});
    const shell = stageShell(stTitle(st), stWhat(st), sizeText);
    const grid = el('div', 'maps');
    for (const ch of chans[s]) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('aria-label', `${stTitle(st)}, ${ch+1}`);
      b.append(drawMap(el('canvas'), a, ch));

}

/* ---------------- 3D view ---------------- */
const view = {has3D: false, ready: false, visible: false, stale: false};
let mode = '3d';
const GAP = 6, INPUT = 6, RF_COLOR = 0x22D3EE;

function webglOK(){
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch { return false; }
}
view.has3D = !!THREE && webglOK();
if (!view.has3D) { $('seg').hidden = true; mode = 'flat'; }

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function init3D(){
  const box = $('stage3d');
  const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.append(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(6, 10, 8); scene.add(sun);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 0.5;
  controls.addEventListener('start', () => { controls.autoRotate = false; });
  const group = new THREE.Group(); scene.add(group);
  const rfGroup = new THREE.Group(); scene.add(rfGroup);
  Object.assign(view, {renderer, scene, camera, controls, group, rfGroup, pickables: [], ready: true});

  const resize = () => {
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(box);
  resize();

  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY}; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) pick(e);
    down = null;
  });

  const loop = () => {
    requestAnimationFrame(loop);
    if (!view.visible || document.hidden) return;
    if (view.onFrame) view.onFrame(performance.now());
    if (view.tweens && view.tweens.length) stepTweens(performance.now());
    controls.update();
    renderer.render(scene, camera);
  };
  loop();
}

function disposeTree(obj){
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
  obj.clear();
}

function makeLabel(lines, height){
  const ink = cssVar('--ink') || '#18233D';
  const muted = cssVar('--muted') || '#56627A';
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  const fonts = [`800 64px ${cssVar('--display')}`, `400 40px ${cssVar('--body')}`];
  g.direction = STR[LANG].dir;
  let w = 0;
  lines.forEach((t, i) => { g.font = fonts[Math.min(i, 1)]; w = Math.max(w, g.measureText(t).width); });
  c.width = Math.ceil(w + 24);
  c.height = lines.length === 1 ? 84 : 140;
  lines.forEach((t, i) => {
    g.font = fonts[Math.min(i, 1)];
    g.fillStyle = i === 0 ? ink : muted;
    g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(t, c.width / 2, i === 0 ? 6 : 82);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false}));
  const hgt = height * (c.height / 84);
  sprite.scale.set(hgt * c.width / c.height, hgt, 1);
  return sprite;
}

function canvasTexture(canvas, pixelated){
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = pixelated ? THREE.NearestFilter : THREE.LinearFilter;
  return tex;
}

function frameCamera(group = view.group, dirOverride = null){
  const {camera, controls} = view;
  const box = new THREE.Box3().setFromObject(group);
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z));
  const portrait = camera.aspect < 1;
  const dir = (dirOverride || (portrait ? new THREE.Vector3(0.45, 0.85, 1) : new THREE.Vector3(0.95, 0.42, 1))).clone().normalize();
  const target = box.getCenter(new THREE.Vector3());
  const place = d => { camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); };
  const bounds = () => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of pts) { const q = p.clone().project(camera); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    return {x0, x1, y0, y1};
  };
  let dist = 40;
  for (let round = 0; round < 3; round++) {
    let lo = 5, hi = 300;
    for (let i = 0; i < 30; i++) {
      dist = (lo + hi) / 2; place(dist);
      const b = bounds();
      if (b.x0 > -0.94 && b.x1 < 0.94 && b.y0 > -0.9 && b.y1 < 0.9) hi = dist; else lo = dist;
    }
    dist = hi; place(dist);
    const b = bounds();
    const mx = (b.x0 + b.x1) / 2, my = (b.y0 + b.y1) / 2;
    const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist, halfW = halfH * camera.aspect;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(right, mx * halfW).addScaledVector(up, my * halfH);
  }
  place(dist);
  controls.target.copy(target);
  controls.maxDistance = dist * 2.5;
  controls.update();
}

async function build3D(){
  const {group, rfGroup} = view;
  disposeTree(group); disposeTree(rfGroup);
  view.pickables = [];
  view.stale = false;
  view.net = null;
  view.onFrame = null;
  view.allLayers = null; view.tweens = [];
  $('netLayers').hidden = true;
  const variant = sub === 'all' ? 'all' : 'one';
  view.builtSub = variant;
  view.builtFor = current;
  await document.fonts.ready;
  if (variant === 'one') { buildOne(); return; }
  const {acts, chans, inputCanvas, stages, kind, netSize} = current;

  const inputMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(INPUT, INPUT),
    new THREE.MeshBasicMaterial({map: canvasTexture(inputCanvas, false), side: THREE.DoubleSide})
  );
  group.add(inputMesh);
  const inLabel = makeLabel([inputTitle(kind), t('pixels', {n: netSize})], 0.55);
  inLabel.position.set(0, INPUT / 2 + 0.75, 0);
  group.add(inLabel);

  view.visible = mode === '3d';
  view.controls.autoRotate = false;

  const layerGroups = [];
  const LGAP = GAP * 1.5;
  view.allLayers = [];
  acts.forEach((a, s) => {
    const lg = new THREE.Group();
    const z0 = -(s + 1) * LGAP;
    const size = 1.2 + 1.6 * Math.sqrt(Math.min(1, a.w / 112));
    const n = chans[s].length, dz = 0.26, dx = 0.09, dy = 0.07;
    const meshes = [], stackPos = [], gridPos = [];
    const cols = 4, rows = Math.ceil(n / cols), gs = 0.62, step = size * gs * 1.12;
    const ph = size * Math.min(1, a.h / a.w);
    chans[s].forEach((ch, i) => {
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(size, ph),
        new THREE.MeshBasicMaterial({map: canvasTexture(drawMap(document.createElement('canvas'), a, ch), true), side: THREE.DoubleSide})
      );
      stackPos.push(new THREE.Vector3(i * dx - (n - 1) * dx / 2, i * dy - (n - 1) * dy / 2, z0 - i * dz));
      gridPos.push(new THREE.Vector3(((cols - 1) / 2 - (i % cols)) * step, ((rows - 1) / 2 - Math.floor(i / cols)) * step, z0));
      mesh.position.copy(stackPos[i]);
      mesh.userData = {stage: s, ch, size};
      lg.add(mesh); meshes.push(mesh);
      view.pickables.push(mesh);
    });
    // a thin box around the stack, like the usual drawing of these layers
    const depth = Math.max(0.05, (n - 1) * dz);
    const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(size + (n - 1) * dx, ph + (n - 1) * dy, depth)),
      new THREE.LineBasicMaterial({color: 0x8E97B5}));
    box.position.set(0, 0, z0 - depth / 2);
    lg.add(box);
    const label = makeLabel([stTitle(stages[s]), stWhat(stages[s]) || t('pixels', {n: a.w})], 0.5);
    label.position.set(0, ph / 2 + (n - 1) * dy / 2 + 0.8, z0 - depth / 2);
    lg.add(label);
    lg.visible = false;
    group.add(lg);
    layerGroups.push(lg);
    view.allLayers.push({meshes, stackPos, gridPos, gs, box, label,
      labelClosed: label.position.clone(), labelOpen: new THREE.Vector3(0, rows * step / 2 + 0.8, z0), open: false});
  });

  // the guess
  const og = new THREE.Group();
  const zOut = -(acts.length + 1.6) * LGAP;
  const accent = new THREE.Color(cssVar('--accent') || '#3346D3');
  {
    const {probs, top} = current.guess;
    top.forEach((idx, i) => {
      const p = probs[idx];
      const h = 0.15 + 4 * p;
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, h, 0.7),
        new THREE.MeshLambertMaterial({color: accent.clone().lerp(new THREE.Color('#9aa6bf'), i === 0 ? 0 : 0.45)})
      );
      const x = (i - 2) * 1.7;
      bar.position.set(x, -2 + h / 2, zOut);
      og.add(bar);
      const lab = makeLabel([labelFor(kind, idx), (p * 100).toFixed(1) + '%'], i === 0 ? 0.42 : 0.3);
      lab.position.set(x, -2 + h + 0.55, zOut);
      og.add(lab);
    });
    const gl = makeLabel(kind === 'draw' ? [t('guess'), t('layerOf', {n: 7, total: 7})] : [t('guess')], 0.55);
    gl.position.set(0, 3.6, zOut);
    og.add(gl);
  }
  og.visible = false;
  group.add(og);
  layerGroups.push(og);
  frameCamera();

  for (const lg of layerGroups) {
    await sleep(220);
    lg.visible = true;
  }
  if (!reduceMotion) view.controls.autoRotate = true;
}


/* opening and closing the stacks in "All patterns" */
function tweenTo(obj, pos, scale, ms = 450){
  view.tweens.push({obj, from: obj.position.clone(), to: pos.clone(), s0: obj.scale.x, s1: scale, t0: performance.now(), ms: reduceMotion ? 1 : ms});
}
function stepTweens(now){
  view.tweens = view.tweens.filter(tw => {
    const k = Math.min(1, (now - tw.t0) / tw.ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    tw.obj.position.lerpVectors(tw.from, tw.to, e);
    if (!tw.keepScale) tw.obj.scale.setScalar(tw.s0 + (tw.s1 - tw.s0) * e);
    return k < 1;
  });
}
function openLayer(which){
  view.allLayers.forEach((L, k) => {
    const open = k === which;
    if (open === L.open) return;
    L.open = open;
    L.meshes.forEach((m, i) => tweenTo(m, open ? L.gridPos[i] : L.stackPos[i], open ? L.gs : 1));
    view.tweens.push({obj: L.label, from: L.label.position.clone(), to: (open ? L.labelOpen : L.labelClosed).clone(), s0: 1, s1: 1, t0: performance.now(), ms: reduceMotion ? 1 : 450, keepScale: true});
    L.box.visible = !open;
  });
  view.controls.autoRotate = false;
}

function clearRF(){ disposeTree(view.rfGroup); }

function pick(e){
  if (!current || sub === 'steps' || view.net) return;
  const {camera, renderer} = view;
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(view.pickables, false);
  if (!hits.length || !hits[0].uv) { clearRF(); $('aloneBtn').hidden = true; if (view.allLayers) openLayer(-1); return; }
  const hit = hits[0];
  const {stage, ch, size} = hit.object.userData;
  if (view.allLayers && !view.allLayers[stage].open) { clearRF(); $('aloneBtn').hidden = true; openLayer(stage); return; }
  if (sub === 'all') {
    view.lastPick = {stage, idx: current.chans[stage].indexOf(ch)};
    $('aloneBtn').hidden = view.lastPick.idx < 0;
  }
  const a = current.acts[stage];
  const x = Math.min(a.w - 1, Math.floor(hit.uv.x * a.w));
  const y = Math.min(a.h - 1, Math.floor((1 - hit.uv.y) * a.h));
  showRF(hit.object, stage, ch, size, x, y);
}

function showRF(mesh, s, ch, size, x, y){
  clearRF();
  const a = current.acts[s];
  const N = current.netSize;
  const jump = N / a.w;
  const rf = current.stages[s].rf || jump * 3;
  const cx = (x + 0.5) * jump, cy = (y + 0.5) * jump;
  const x0 = Math.max(0, cx - rf / 2), x1 = Math.min(N, cx + rf / 2);
  const y0 = Math.max(0, cy - rf / 2), y1 = Math.min(N, cy + rf / 2);
  const P = (px, py) => new THREE.Vector3((px / N - 0.5) * INPUT, (0.5 - py / N) * INPUT, 0.03);
  const corners = [P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1)];

  const PW = mesh.geometry.parameters.width, PH = mesh.geometry.parameters.height;
  const local = (u, v) => mesh.localToWorld(new THREE.Vector3(u * PW - PW / 2, PH / 2 - v * PH, 0.03));
  const cc = local((x + 0.5) / a.w, (y + 0.5) / a.h);
  const sq = [local(x / a.w, y / a.h), local((x + 1) / a.w, y / a.h), local((x + 1) / a.w, (y + 1) / a.h), local(x / a.w, (y + 1) / a.h)];

  const pts = [];
  corners.forEach(c => pts.push(cc, c));
  for (let i = 0; i < 4; i++) pts.push(corners[i], corners[(i + 1) % 4]);
  for (let i = 0; i < 4; i++) pts.push(sq[i], sq[(i + 1) % 4]);
  view.rfGroup.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: RF_COLOR})
  ));

  const fill = new THREE.Mesh(
    new THREE.PlaneGeometry((x1 - x0) / N * INPUT, (y1 - y0) / N * INPUT),
    new THREE.MeshBasicMaterial({color: RF_COLOR, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false})
  );
  fill.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2));
  view.rfGroup.add(fill);
  view.controls.autoRotate = false;

  const whole = (x1 - x0) >= N - 1 && (y1 - y0) >= N - 1;
  setStatus(t(whole ? 'rfWhole' : 'rfPart', {t: stTitle(current.stages[s])}));
}

/* ---------------- 3D: one pattern per step, with the window passing over ---------------- */
function channelCanvas(src, ch){
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0, SIZE, SIZE);
  const d = g.getImageData(0, 0, SIZE, SIZE);
  for (let i = 0; i < d.data.length; i += 4) for (let k = 0; k < 3; k++) if (k !== ch) d.data[i + k] = 0;
  g.putImageData(d, 0, 0);
  return c;
}
function planeAt(mesh, size, u, v){
  const p = mesh.geometry.parameters, W = p.width, H = p.height;
  return mesh.localToWorld(new THREE.Vector3(u * W - W / 2, H / 2 - v * H, 0.04));
}
function planeBox(mesh, size, u0, v0, u1, v1){
  const a = planeAt(mesh, size, u0, v0), b = planeAt(mesh, size, u1, v0), c = planeAt(mesh, size, u1, v1), d = planeAt(mesh, size, u0, v1);
  return [a, b, b, c, c, d, d, a];
}
// which pattern to show in each layer: 0 = the one found most, 1 = the second, ...
let oneSel = [];
const selFor = s => oneSel[s] || 0;
let oneSelCh = {};   // a pattern picked by its number, for a layer
// A rough name for a first-layer pattern, from what it lit up in this picture
function describeMap(act, ch, inputCanvas, gray){
  const {data, h, w, c} = act, N = h * w;
  const M = new Float32Array(N); let max = 0, sum = 0;
  for (let i = 0; i < N; i++) { const v = Math.max(0, data[i * c + ch]); M[i] = v; if (v > max) max = v; sum += v; }
  if (max <= 1e-6) return null;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = true; g.drawImage(inputCanvas, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  const L = new Float32Array(N), Rc = new Float32Array(N), Gc = new Float32Array(N), Bc = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = px[i * 4] / 255, gg = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
    L[i] = 0.299 * r + 0.587 * gg + 0.114 * b; Rc[i] = r - (gg + b) / 2; Gc[i] = gg - (r + b) / 2; Bc[i] = b - (r + gg) / 2;
  }
  const corr = (a, b) => {
    let ma = 0, mb = 0; for (let i = 0; i < N; i++) { ma += a[i]; mb += b[i]; } ma /= N; mb /= N;
    let sab = 0, saa = 0, sbb = 0;
    for (let i = 0; i < N; i++) { const da = a[i] - ma, db = b[i] - mb; sab += da * db; saa += da * da; sbb += db * db; }
    return saa > 0 && sbb > 0 ? sab / Math.sqrt(saa * sbb) : 0;
  };
  let cover = 0, ex = 0, ey = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (M[i] > 0.5 * max) cover++;
    if (x + 1 < w) ex += Math.abs(M[i + 1] - M[i]);
    if (y + 1 < h) ey += Math.abs(M[i + w] - M[i]);
  }
  cover /= N;
  let key;
  if (cover > 0.3) {
    const rL = corr(M, L);
    if (rL > 0.4) key = 'pBright';
    else if (rL < -0.4) key = 'pDark';
    else if (!gray) {
      const cs = [['pRed', corr(M, Rc)], ['pGreen', corr(M, Gc)], ['pBlue', corr(M, Bc)]].sort((p, q) => q[1] - p[1]);
      key = cs[0][1] > 0.3 ? cs[0][0] : 'pAreas';
    } else key = 'pAreas';
  } else if (ey > ex * 1.5) key = 'pHLines';      // changes from top to bottom = lines that go across
  else if (ex > ey * 1.5) key = 'pVLines';
  else key = 'pEdges';
  return {key, strength: sum / N};
}
let pickNames = null;   // the patterns offered in the picker (first layer), with names
function buildPicker(){
  const box = $('patternPick');
  box.innerHTML = '';
  if (!current) return;
  const head = el('div', 'pick-head');
  head.append(el('span', 'pick-label', t('pickPattern')));
  box.append(head);
  const a = current.acts[0], gray = current.kind === 'draw';
  if (!pickNames || pickNames.for !== current) {
    // look at every pattern of the first layer and keep up to 6 with different names (the strongest of each)
    const all = [];
    for (let ch = 0; ch < a.c; ch++) { const d = describeMap(a, ch, current.inputCanvas, gray); if (d) all.push({ch, ...d}); }
    all.sort((p, q) => q.strength - p.strength);
    const seen = new Set(), list = [];
    for (const d of all) if (!seen.has(d.key)) { seen.add(d.key); list.push(d); }
    for (const d of all) { if (list.length >= 6) break; if (!list.includes(d)) list.push(d); }
    pickNames = {for: current, list: list.slice(0, 6)};
  }
  const row = el('div', 'pick-row');
  const chosen = oneSelCh[0] !== undefined ? oneSelCh[0] : current.chans[0][Math.min(selFor(0), current.chans[0].length - 1)];
  const total = {}, seenN = {};
  pickNames.list.forEach(d => { total[d.key] = (total[d.key] || 0) + 1; });
  pickNames.list.forEach(d => {
    seenN[d.key] = (seenN[d.key] || 0) + 1;
    const name = t(d.key) + (total[d.key] > 1 ? ' ' + seenN[d.key] : '');
    const b = el('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', d.ch === chosen);
    b.append(drawMap(el('canvas'), a, d.ch), el('span', 'pick-name', name));
    b.addEventListener('click', () => {
      oneSelCh[0] = d.ch;
      row.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      build3D();
    });
    row.append(b);
  });
  box.append(row);
  box.append(el('p', 'pick-note', t('pickNote')));
}

function buildOne(){

function playOne(){
  const A = view.oneAnim; if (!A) return;
  const {inputs, layers, og, photoMesh, rgbParts} = A;
  const grp = view.group;
  if (A.lines) { A.lines.geometry.dispose(); grp.remove(A.lines); }
  const lines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color: 0xFFC83D}));
  grp.add(lines); A.lines = lines;
  const setLines = pts => { lines.geometry.dispose(); lines.geometry = new THREE.BufferGeometry().setFromPoints(pts); };
  layers.forEach(L => L.reveal(0)); og.visible = false;
  rgbParts.forEach(p => { p.visible = false; });
  const done = () => { rgbParts.forEach(p => { p.visible = true; }); layers.forEach(L => L.reveal(64)); setLines([]); og.visible = true; view.onFrame = null; if (!reduceMotion) view.controls.autoRotate = true; };
  if (reduceMotion) { done(); return; }
  let s = 0, i = 0, nextAt = 0, split = rgbParts.length ? 0 : -1;
  view.onFrame = now => {
    if (now < nextAt) return;
    if (split >= 0) {          // the photo splits into its colour layers, one after another
      if (split < 3) {
        rgbParts[split].visible = true;
        const m = rgbParts[split];
        setLines([...planeBox(photoMesh, INPUT, 0, 0, 1, 1).filter((_, k) => k % 2 === 0).flatMap(p => [p, m.localToWorld(new THREE.Vector3((p.x - photoMesh.position.x), (p.y - photoMesh.position.y), 0))])]);

    const bx = i % 8, by = Math.floor(i / 8);
    // the window: a bit bigger than one block, so it overlaps its neighbours like a real filter
    const u0 = Math.max(0, (bx - 0.5) / 8), v0 = Math.max(0, (by - 0.5) / 8), u1 = Math.min(1, (bx + 1.5) / 8), v1 = Math.min(1, (by + 1.5) / 8);
    const pts = [];
    src.forEach(p => pts.push(...planeBox(p.mesh, p.size, u0, v0, u1, v1)));
    const last = src[src.length - 1];
    pts.push(planeAt(last.mesh, last.size, (u0 + u1) / 2, (v0 + v1) / 2), planeAt(L.mesh, L.size, (bx + 0.5) / 8, (by + 0.5) / 8));

    setLines(pts);
    L.reveal(i + 1);
    i++; nextAt = now + 28;

}

const COOL = (() => {
  const stops = [[8, 10, 30], [22, 32, 120], [40, 90, 230], [34, 211, 238], [235, 255, 255]];
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const tt = i / 255 * (stops.length - 1), k = Math.min(Math.floor(tt), stops.length - 2), f = tt - k;
    for (let j = 0; j < 3; j++) lut[i * 3 + j] = stops[k][j] + (stops[k + 1][j] - stops[k][j]) * f;

  return lut;
})();
const NET_DIR = () => view.camera.aspect < 1 ? new THREE.Vector3(0, 0.75, 1) : new THREE.Vector3(0, 0.42, 1);
function coolMap(canvas, act, ch){
  const {data, h, w, c} = act;

  for (let i = 0; i < h * w; i++) max = Math.max(max, data[i * c + ch]);
  max = max || 1;
  const g = canvas.getContext('2d'), img = g.createImageData(w, h);
  for (let i = 0; i < h * w; i++) {
    const k = Math.round(Math.max(0, data[i * c + ch]) / max * 255) * 3;
    img.data[i*4] = COOL[k]; img.data[i*4+1] = COOL[k+1]; img.data[i*4+2] = COOL[k+2]; img.data[i*4+3] = 255;

}

function updateNet(F){

let sub = 'one';            // 'one' | 'all' | 'steps'
const FP_N = 12;            // the picture is shrunk to 12 x 12 so the numbers fit
const K1 = [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]];   // finds edges that go up and down
const K2 = [[0, 1, 0], [1, 1, 1], [0, 1, 0]];
function fpCompute(){
  const c = document.createElement('canvas'); c.width = c.height = FP_N;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(current.inputCanvas, 0, 0, FP_N, FP_N);
  const px = g.getImageData(0, 0, FP_N, FP_N).data;
  const gray = current.kind === 'draw';
  const C = gray ? 1 : 3;
  const inp = [];
  for (let ch = 0; ch < C; ch++) {
    const m = [];
    for (let y = 0; y < FP_N; y++) { const row = []; for (let x = 0; x < FP_N; x++) row.push(Math.round(px[(y * FP_N + x) * 4 + (gray ? 0 : ch)] / 255 * 9)); m.push(row); }
    inp.push(m);
  }
  const conv = (planes, K) => {
    const n = planes[0].length - 2, out = [];
    for (let y = 0; y < n; y++) { const row = []; for (let x = 0; x < n; x++) {
      let sum = 0;
      for (const p of planes) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) sum += p[y + i][x + j] * K[i][j];
      row.push(Math.max(0, sum));

  for (let y = 0; y < conv1.length / 2; y++) { const row = [], arg = []; for (let x = 0; x < conv1.length / 2; x++) {
    let best = -1, by = 0, bx = 0;

function gridTexture(vals, colorOf, revealed, opts = {}){
  const n = vals.length, cs = 64;
  const c = document.createElement('canvas'); c.width = c.height = n * cs;
  const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  const draw = (count, mark) => {
    g.clearRect(0, 0, c.width, c.height);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const i = y * n + x, on = i < count;
      const [r, gg, b] = on ? colorOf(vals[y][x]) : [236, 233, 245];
      g.fillStyle = `rgb(${r},${gg},${b})`; g.fillRect(x * cs, y * cs, cs, cs);
      g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 3; g.strokeRect(x * cs + 1.5, y * cs + 1.5, cs - 3, cs - 3);

  const gLab = lab(guessTxt, 0, 0.2, -21, 1.0); gLab.visible = false;

      c1.draw(i + 1);
      const pts = [];
      inPlanes.forEach(p => pts.push(...fpBox(p, y, x, y + 3, x + 3)));
      const target = fpAt(c1, x + 0.5, y + 0.5);
      const ctr = fpAt(inPlanes[inPlanes.length - 1], x + 1.5, y + 1.5);
      pts.push(ctr, target, ...fpBox(c1, y, x, y + 1, x + 1));
      setLines(pts); }},
    {count: nP * nP, ms: 200, step: i => { const y = Math.floor(i / nP), x = i % nP;
      c1.draw(n1 * n1, R.poolArg[y][x]); pl.draw(i + 1);
      const [my, mx] = R.poolArg[y][x];
      setLines([...fpBox(c1, 2 * y, 2 * x, 2 * y + 2, 2 * x + 2), fpAt(c1, mx + 0.5, my + 0.5), fpAt(pl, x + 0.5, y + 0.5), ...fpBox(pl, y, x, y + 1, x + 1)]); }},
    {count: n2 * n2, ms: 350, step: i => { const y = Math.floor(i / n2), x = i % n2;
      c1.draw(n1 * n1); c2.draw(i + 1);
      setLines([...fpBox(pl, y, x, y + 3, x + 3), fpAt(pl, x + 1.5, y + 1.5), fpAt(c2, x + 0.5, y + 0.5), ...fpBox(c2, y, x, y + 1, x + 1)]); }},
    {count: 1, ms: 400, step: () => { setLines([fpAt(c2, 1.5, 1.5), new THREE.Vector3(0, 0, -20.6)]); gLab.visible = true; gHead.visible = true; }}
  ];
  let ph = 0, idx = 0, nextAt = 0;
  const finish = () => { phases.forEach(p => { for (let i = 0; i < p.count; i++) p.step(i); }); setLines([]); c1.draw(n1 * n1); view.onFrame = null; };
  view.group.visible = false; clearRF();
  frameCamera(grp, view.camera.aspect < 1 ? new THREE.Vector3(0.35, 0.6, 1) : new THREE.Vector3(0.62, 0.3, 1));
  view.controls.autoRotate = false;
  if (reduceMotion) { finish(); return; }
  view.onFrame = now => {
    if (now < nextAt) return;
    const p = phases[ph];
    p.step(idx); idx++; nextAt = now + p.ms;
    if (idx >= p.count) { ph++; idx = 0; nextAt = now + 600; if (ph >= phases.length) { view.onFrame = null; setTimeout(() => { if (sub === 'steps') setLines([]); }, 1500); } }
  };
}

/* ---------------- draw a number or a shape ---------------- */
let drawModel = null, drawViz = null;
async function ensureDraw(){
  if (drawViz) return;
  const bin = atob(DRAW_MODEL.weightData);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  drawModel = await tf.loadLayersModel(tf.io.fromMemory({modelTopology: DRAW_MODEL.modelTopology, weightSpecs: DRAW_MODEL.weightSpecs, weightData: buf.buffer}));
  const outs = DRAW_STAGES.map(st => drawModel.getLayer(st.name).output);
  outs.push(drawModel.outputs[0]);
  drawViz = tf.model({inputs: drawModel.inputs, outputs: outs});
  drawFull = tf.model({inputs: drawModel.inputs, outputs: NET_KEYS.map(k => drawModel.getLayer(k).output)});
}
const NET_KEYS = ['c1', 'p1', 'c2', 'p2', 'c3', 'fc', 'out'];
let drawFull = null;
function drawForward(v){
  const outs = tf.tidy(() => drawFull.predict(tf.tensor4d(v, [1, 28, 28, 1])));
  const F = {in: {data: v, h: 28, w: 28, c: 1}};
  NET_KEYS.forEach((k, i) => {
    const tt = outs[i];
    F[k] = tt.shape.length === 4 ? {data: tt.dataSync(), h: tt.shape[1], w: tt.shape[2], c: tt.shape[3]} : {data: tt.dataSync()};
  });
  tf.dispose(outs);
  return F;
}
function drawResult(v){
  const F = drawForward(v);
  const probs = F.out.data;
  const top = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]).slice(0, 5);
  const small = document.createElement('canvas'); small.width = small.height = 28;
  const sg = small.getContext('2d'), img = sg.createImageData(28, 28);
  for (let i = 0; i < 784; i++) { const g = Math.round(v[i] * 255); img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = g; img.data[i*4+3] = 255; }
  sg.putImageData(img, 0, 0);
  const inputCanvas = document.createElement('canvas'); inputCanvas.width = inputCanvas.height = SIZE;
  const ig = inputCanvas.getContext('2d'); ig.imageSmoothingEnabled = false; ig.drawImage(small, 0, 0, SIZE, SIZE);
  const acts = [F.c1, F.p1, F.c2, F.p2, F.c3, {data: F.fc.data, h: 4, w: 16, c: 1}];
  return {kind: 'draw', acts, stages: DRAW_STAGES, netSize: 28, inputCanvas, net: F,
    chans: acts.map(a => strongestChannels(a, MAPS_PER_LAYER)), guess: {probs, top}};
}

const pad = $('padCanvas'), pctx = pad.getContext('2d');
let drawing = false, last = null, inked = false, liveTimer = null;
function clearPad(){
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, pad.width, pad.height);
  inked = false; $('live').textContent = t('liveEmpty');
}
clearPad();
function padPoint(e){
  const r = pad.getBoundingClientRect();
  return {x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height};
}
pad.addEventListener('pointerdown', e => { drawing = true; last = padPoint(e); pad.setPointerCapture(e.pointerId); stroke(last, last); });
pad.addEventListener('pointermove', e => { if (!drawing) return; const p = padPoint(e); stroke(last, p); last = p; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => pad.addEventListener(ev, () => {
  if (!drawing) return; drawing = false;
  clearTimeout(liveTimer); liveTimer = setTimeout(liveGuess, 150);
}));
function stroke(a, b){
  pctx.strokeStyle = '#fff'; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.lineWidth = pad.width * 0.065;
  pctx.beginPath(); pctx.moveTo(a.x, a.y); pctx.lineTo(b.x, b.y); pctx.stroke();
  inked = true;
}
// Turn the drawing into a 28 x 28 picture, the same way the training pictures were made
function drawingTo28(){
  const W = pad.width, H = pad.height;
  const d = pctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4] > 30) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = 20 / Math.max(w, h);
  const nw = Math.max(1, Math.round(w * k)), nh = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas'); c.width = c.height = 28;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 28, 28);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(pad, x0, y0, w, h, Math.floor((28 - nw) / 2), Math.floor((28 - nh) / 2), nw, nh);
  const px = g.getImageData(0, 0, 28, 28).data;
  const v = new Float32Array(784);
  let tot = 0, cx = 0, cy = 0;
  for (let i = 0; i < 784; i++) { v[i] = px[i * 4] / 255; tot += v[i]; cx += v[i] * (i % 28); cy += v[i] * Math.floor(i / 28); }
  const dx = Math.round(13.5 - cx / tot), dy = Math.round(13.5 - cy / tot);
  const out = new Float32Array(784);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    const sx = x - dx, sy = y - dy;
    if (sx >= 0 && sx < 28 && sy >= 0 && sy < 28) out[y * 28 + x] = v[sy * 28 + sx];
  }
  return out;
}
function liveGuess(){
  if (!drawModel || !inked) return;
  const v = drawingTo28(); if (!v) return;
  const p = tf.tidy(() => drawModel.predict(tf.tensor4d(v, [1, 28, 28, 1])).dataSync());
  let best = 0; for (let i = 1; i < p.length; i++) if (p[i] > p[best]) best = i;
  $('live').textContent = t('liveGuess', {x: t('drawLabels')[best]});
  if ((!current || current.kind !== 'draw') && !busy && drawFull) { runDraw({auto: true}); return; }
  if (current && current.kind === 'draw' && !busy && drawFull) {
    const res = drawResult(v);
    current = res;
    buildGuess(); buildFlat();
    if (view.ready && mode === '3d') applySub();
    else view.stale = true;
  }
}
async function runDraw(opts = {}){
  if (!drawViz) return;
  if (!inked) { setStatus(t('sDrawFirst'), true); return; }
  const v = drawingTo28(); if (!v) { setStatus(t('sDrawFirst'), true); return; }
  if (!(await startRun())) return;
  try {
    await showResults(drawResult(v), {noScroll: !!opts.auto});
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}
$('padClear').addEventListener('click', clearPad);
$('seeInside').addEventListener('click', runDraw);



/* ---------------- the little picture next to the title changes every round ---------------- */
(function heroPictures(){
  const art = document.querySelector('.hero-art'); if (!art) return;
  const px = [...art.querySelectorAll('.px')], outs = [...art.querySelectorAll('.ox')], win = art.querySelector('.win');
  if (px.length !== 49 || outs.length !== 9 || !win) return;
  const PICS = [
    [['0011100', '0111110', '1101011', '1111111', '1011101', '0100010', '0011100'], '🙂'],
    [['0110110', '1111111', '1111111', '1111111', '0111110', '0011100', '0001000'], '❤️'],
    [['0111110', '0000010', '0000010', '0011110', '0000010', '0000010', '0111110'], '3'],
    [['0001000', '0011100', '0111110', '1111111', '0110110', '0110110', '0110110'], '🏠'],
    [['0001000', '0001000', '1111111', '0111110', '0011100', '0110110', '0100010'], '⭐'],
    [['0111110', '0000010', '0000100', '0001000', '0001000', '0010000', '0010000'], '7'],
    [['1000001', '1100011', '1111111', '1011101', '1111111', '1110111', '0111110'], '🐱']
  ];
  const guessT = art.querySelector('.guess-t'), guessG = art.querySelector('.guess');
  let revealTimer = null;
  let k = 0;
  const show = (item, keepGuess) => {
    const [pic, answer] = item;
    const ltr = document.documentElement.dir !== 'rtl';
    if (!keepGuess) {
      // the guess: "?" while the window is looking, then the answer near the end of the round
      clearTimeout(revealTimer);
      guessT.textContent = '?'; guessG.classList.remove('pop');
      revealTimer = setTimeout(() => { guessT.textContent = answer; guessG.classList.add('pop'); }, reduceMotion ? 0 : 7600);
    }
    px.forEach((r, i) => {
      const on = pic[Math.floor(i / 7)][i % 7] === '1';
      r.setAttribute('fill', on ? 'var(--ink)' : 'var(--line)');
      r.setAttribute('opacity', on ? 1 : 0.55);
    });
    // each result square = how much of the picture the window saw at that spot
    outs.forEach((r, i) => {
      const R = Math.floor(i / 3), Cc = i % 3;
      let n = 0;
      for (let y = 2 * R; y < 2 * R + 3; y++) for (let x = 2 * Cc; x < 2 * Cc + 3; x++) n += pic[y][ltr ? 6 - x : x] === '1' ? 1 : 0;
      r.setAttribute('fill', n >= 5 ? 'var(--ink)' : n >= 3 ? 'color-mix(in srgb, var(--ink) 45%, var(--line))' : 'var(--line)');
    });
  };
  show(PICS[0]);
  win.addEventListener('animationiteration', () => { k = (k + 1) % PICS.length; show(PICS[k]); });
  new MutationObserver(() => show(PICS[k], true)).observe(document.documentElement, {attributes: true, attributeFilter: ['dir']});
})();

/* ---------------- a magnifying glass over the title (mouse only) ---------------- */
(function titleLens(){
  const wrap = document.querySelector('.title-wrap'); if (!wrap) return;
  const h1 = wrap.querySelector('h1'), lens = wrap.querySelector('.lens'), inner = wrap.querySelector('.lens-in');
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const Z = 1.7, R = 72;
  h1.addEventListener('pointerenter', () => {
    const cs = getComputedStyle(h1);
    inner.innerHTML = h1.innerHTML;
    Object.assign(inner.style, {width: h1.clientWidth + 'px', font: cs.font, lineHeight: cs.lineHeight, letterSpacing: cs.letterSpacing, color: cs.color, textAlign: cs.textAlign, direction: cs.direction});
    lens.classList.add('on');
  });
  h1.addEventListener('pointerleave', () => lens.classList.remove('on'));
  h1.addEventListener('pointermove', e => {
    const r = h1.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    lens.style.left = (e.clientX - wr.left - R) + 'px';
    lens.style.top = (e.clientY - wr.top - R) + 'px';
    inner.style.transform = `translate(${R - mx * Z}px, ${R - my * Z}px) scale(${Z})`;
  });
})();
