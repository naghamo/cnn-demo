<style>
:root{
  color-scheme: light;
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#18233D; --muted:#56627A; --line:#CBD3E1;
  --accent:#3346D3; --accent-ink:#FFFFFF; --bar:#3346D3; --bar-bg:#DDE3EE; --map-bg:#000004;
  --display:"Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#10162A; --surface:#182039; --ink:#E7ECF7; --muted:#9AA6BF; --line:#2B3655;
    --accent:#8C9BFF; --accent-ink:#10162A; --bar:#8C9BFF; --bar-bg:#26304D;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:17px; line-height:1.5;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
main{max-width:1100px; margin:0 auto; padding:40px 20px 64px}
h1{
  font-family:var(--display); font-weight:800; font-size:clamp(2.6rem, 8vw, 5.2rem);
  line-height:.95; letter-spacing:-.03em; margin:0 0 14px;
}
.lede{font-size:1.15rem; color:var(--muted); margin:0 0 28px; max-width:36ch}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
[hidden]{display:none !important}

.drop{
  border:2px dashed var(--line); border-radius:18px; background:var(--surface);
  padding:28px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
}
.drop.over{border-color:var(--accent)}
.btn{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px;
  padding:13px 24px; font-weight:700; font-size:1.05rem;
}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn:disabled{opacity:.5; cursor:wait}
.drop .hint{color:var(--muted); margin:0; flex:1 1 220px}
#status{margin:14px 2px 0; color:var(--muted); min-height:1.5em}
#status.error{color:#C2263A}
@media (prefers-color-scheme: dark){ #status.error{color:#FF8A98} }

/* results */
.results-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:40px}
.results-head h2{font-family:var(--display); font-weight:800; font-size:2rem; margin:0; letter-spacing:-.02em}
.seg{display:inline-flex; border:2px solid var(--line); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; color:var(--ink); padding:8px 20px; border-radius:999px; font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
#stage3d{
  position:relative; margin-top:16px; height:min(72vh, 660px); min-height:380px;
  border-radius:18px; background:var(--surface); overflow:hidden; touch-action:none;
}
#stage3d canvas{display:block; width:100%; height:100%; cursor:grab}
#stage3d canvas:active{cursor:grabbing}
.howto{color:var(--muted); font-size:.92rem; margin:10px 2px 0}

/* flat view */
.legend{margin:0 0 4px}
.stage{
  display:grid; grid-template-columns: 200px 1fr; gap:24px;
  padding:26px 0; border-top:1px solid var(--line);
}
#flat{margin-top:16px}
.stage h3{font-family:var(--display); font-weight:800; font-size:1.7rem; margin:0; letter-spacing:-.01em; line-height:1.1}
.stage .what{margin:6px 0 4px; font-weight:700}
.stage .size{margin:0; color:var(--muted); font-size:.92rem}
.maps{display:grid; grid-template-columns:repeat(auto-fill, minmax(72px,1fr)); gap:6px}
.maps button{padding:0; border:0; background:var(--map-bg); border-radius:4px; overflow:hidden; aspect-ratio:1; display:block}
.maps canvas{width:100%; height:100%; display:block; image-rendering:pixelated}
.maps button:hover canvas{opacity:.85}
.inputView{width:min(100%, 260px); aspect-ratio:1; border-radius:6px; display:block; background:var(--map-bg)}

/* guess */
#guess{margin-top:36px; padding-top:26px; border-top:1px solid var(--line)}
#guess h2{font-family:var(--display); font-weight:800; font-size:2rem; margin:0 0 16px; letter-spacing:-.02em}
.preds{list-style:none; margin:0; padding:0; display:grid; gap:12px; max-width:560px}
.preds li{display:grid; grid-template-columns: 1fr auto; gap:4px 12px; align-items:baseline}
.preds .name{font-weight:700; font-size:1.1rem}
.preds li:first-child .name{font-family:var(--display); font-size:1.6rem; font-weight:800}
.preds .pct{color:var(--muted); font-variant-numeric:tabular-nums}
.preds .track{grid-column:1/-1; height:10px; border-radius:5px; background:var(--bar-bg); overflow:hidden}
.preds .fill{height:100%; background:var(--bar); border-radius:5px; width:0; transition:width .6s ease}
.note{color:var(--muted); font-size:.92rem; margin:16px 0 0}

dialog{border:0; border-radius:18px; padding:22px; background:var(--surface); color:var(--ink); width:min(92vw, 520px)}
dialog::backdrop{background:rgba(8,12,24,.65)}
.zoom{position:relative; width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--map-bg)}
.zoom canvas{position:absolute; inset:0; width:100%; height:100%}
.dlg-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.dlg-head h3{font-family:var(--display); font-weight:800; font-size:1.4rem; margin:0}
.close{background:transparent; border:2px solid var(--line); color:var(--ink); border-radius:999px; width:40px; height:40px; font-size:1.2rem; line-height:1}
.slider{display:flex; gap:12px; align-items:center; margin-top:14px; color:var(--muted)}
.slider input{flex:1; accent-color:var(--accent)}

/* mode chooser */
.modes{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:0 0 18px; max-width:860px}
.mode{text-align:start; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:18px; padding:16px 18px}
.mode strong{display:block; font-family:var(--display); font-weight:800; font-size:1.4rem; line-height:1.15}
.mode span{display:block; color:var(--muted); font-size:.95rem; margin-top:4px}
.mode[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
/* language switch */
.lang{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; margin:0 0 18px}
.lang button{background:transparent; color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:6px 14px; font-weight:700; font-size:.95rem}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
/* camera */
#cam{margin-top:14px; background:var(--surface); border-radius:18px; padding:14px; max-width:560px}
#cam video{width:100%; border-radius:10px; background:#000; display:block; aspect-ratio:4/3; object-fit:cover}
#cam video.mirror{transform:scaleX(-1)}
#cam .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
/* drawing pad */
#pad{background:var(--surface); border-radius:18px; padding:16px; max-width:420px}
#padCanvas{width:100%; aspect-ratio:1; display:block; background:#000; border-radius:12px; touch-action:none; cursor:crosshair}
#live{font-family:var(--display); font-weight:800; font-size:1.6rem; margin:12px 2px 4px; min-height:1.4em}
.pad-row{display:flex; gap:10px; flex-wrap:wrap}
.age-big{font-family:var(--display); font-weight:800; font-size:clamp(3.4rem, 12vw, 6rem); line-height:1.05; letter-spacing:-.03em; margin:0}
.age-unit{font-size:1.2rem; color:var(--muted); margin:6px 0 0}
.inputView{image-rendering:pixelated}
/* Arabic and Hebrew */
:root[lang="ar"]{--display:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif}
:root[lang="he"]{--display:"Rubik", "Segoe UI", Arial, sans-serif; --body:"Rubik", "Segoe UI", Arial, sans-serif}
:root[lang="ar"] *, :root[lang="he"] *{letter-spacing:0 !important}
:root[lang="ar"] h1, :root[lang="he"] h1{line-height:1.15}
:root[lang="ar"] .age-big{line-height:1.25}
@media (max-width:640px){ .modes{grid-template-columns:1fr} .mode strong{font-size:1.2rem} .mode{padding:12px 14px} }

footer{max-width:1100px; margin:0 auto; padding:24px 20px 40px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line)}
footer p{margin:4px 0}

@media (max-width:640px){
  main{padding-top:28px}
  .stage{grid-template-columns:1fr; gap:12px}
  .maps{grid-template-columns:repeat(4, 1fr)}
  #stage3d{height:68vh}
}
@media (prefers-reduced-motion: reduce){ .preds .fill{transition:none} }
</style>

<main>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
    <button type="button" data-lang="he" aria-pressed="false" lang="he">עברית</button>
  </div>
  <h1 data-i18n-html="h1">How does a<br>computer see?</h1>
  <div class="modes" role="group">
    <button type="button" class="mode" id="modeObj" aria-pressed="true"><strong data-i18n="modeObj">What is it?</strong><span data-i18n="modeObjSub">Show it an object</span></button>
    <button type="button" class="mode" id="modeAge" aria-pressed="false"><strong data-i18n="modeAge">How old?</strong><span data-i18n="modeAgeSub">Show it a face</span></button>
    <button type="button" class="mode" id="modeDraw" aria-pressed="false"><strong data-i18n="modeDraw">Draw it</strong><span data-i18n="modeDrawSub">Draw a number or a shape</span></button>
  </div>
  <p class="lede" id="lede"></p>

  <div class="drop" id="drop">
    <button class="btn" id="camBtn" disabled data-i18n="takePhoto">Take a photo</button>
    <button class="btn ghost" id="pick" disabled data-i18n="choosePhoto">Choose a photo</button>
    <button class="btn ghost" id="pattern" disabled data-i18n="testPicture">Try a test picture</button>
    <p class="hint" data-i18n="dropHint">You can also drag or paste a photo here.</p>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="fileCam" accept="image/*" hidden>
  </div>
  <div id="pad" hidden>
    <canvas id="padCanvas" width="280" height="280"></canvas>
    <p id="live" aria-live="polite"></p>
    <div class="pad-row">
      <button class="btn" id="seeInside" disabled data-i18n="seeInside">See how it guessed</button>
      <button class="btn ghost" id="padClear" data-i18n="clear">Clear</button>
    </div>
  </div>
  <div id="cam" hidden>
    <video id="video" playsinline muted autoplay></video>
    <div class="row">
      <button class="btn" id="snap" data-i18n="snap">Snap</button>
      <button class="btn ghost" id="camCancel" data-i18n="cancel">Cancel</button>
    </div>
  </div>
  <p id="status" role="status">…</p>

  
<section id="results" hidden>
    <div class="results-head">
      <h2 data-i18n="resultsHead">What the computer sees</h2>
      <div class="seg" id="seg" role="group" aria-label="View">
        <button type="button" id="btn3d" aria-pressed="true" data-i18n="view3d">3D</button>
        <button type="button" id="btnFlat" aria-pressed="false" data-i18n="viewFlat">Flat</button>
      </div>
    </div>
    <div id="view3d">
      <div id="stage3d"></div>
      <p class="howto" data-i18n="howto"></p>
    </div>
    <div id="flat" hidden></div>
    <div id="guess"></div>
  </section>
</main>

<footer>
  <p data-i18n="footer1">Made by Nagham Omar, Technion.</p>
  <p data-i18n="footer2"></p>
</footer>

<dialog id="zoomDlg">
  <div class="dlg-head">
    <h3 id="zoomTitle"></h3>
    <button class="close" id="zoomClose" data-i18n-aria="close" aria-label="Close">✕</button>
  </div>
  <div class="zoom">
    <canvas id="zoomBase" width="448" height="448"></canvas>
    <canvas id="zoomMap" width="448" height="448"></canvas>
  </div>
  <label class="slider"><span data-i18n="photo">Photo</span>
    <input type="range" id="zoomMix" min="0" max="100" value="100">
    <span data-i18n="pattern">Pattern</span>
  </label>
</dialog>

const LUT = (() => {
  const stops = [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]];
  const lut = new Uint8ClampedArray(256*3);
  for (let i = 0; i < 256; i++) {
    const t = i/255*(stops.length-1), k = Math.min(Math.floor(t), stops.length-2), f = t-k;
    for (let j = 0; j < 3; j++) lut[i*3+j] = stops[k][j] + (stops[k+1][j]-stops[k][j])*f;
  }
  return lut;
})();

/* ---------------- object network ---------------- */
async function loadObjModel(){
  for (const url of MODEL_URLS) {
    try { return await tf.loadLayersModel(url); }
    catch (e) { console.warn('Could not load', url, e); }
  }
  throw new Error('No model could be loaded');
}

function pickStages(model){
  const names = new Set(model.layers.map(l => l.name));
  let s = OBJ_STAGES.filter(st => names.has(st.name));
  if (s.length >= 3) return s;
  const relus = model.layers.filter(l => /relu/i.test(l.name) && Array.isArray(l.outputShape) && l.outputShape.length === 4);
  const n = Math.min(6, relus.length);
  s = [];
  for (let i = 0; i < n; i++) {
    const l = relus[Math.round(i*(relus.length-1)/Math.max(1, n-1))];
    s.push({name:l.name, n:i+1, wkey:null, wi:null, rf:null});
  }
  return s;
}

async function initObjects(){
  try {
    if (typeof tf === 'undefined') throw new Error('TensorFlow.js did not load');
    const model = await loadObjModel();
    objStages = pickStages(model);
    const outputs = objStages.map(st => model.getLayer(st.name).output);
    outputs.push(model.outputs[0]);
    objModel = tf.model({inputs: model.inputs, outputs});
    tf.tidy(() => { objModel.predict(tf.zeros([1, SIZE, SIZE, 3])); });
    if (appMode === 'obj') { readyStatus(); setButtons(true); }
  } catch (e) {
    console.error(e);
    if (appMode === 'obj') setStatus(t('sLoadFail'), true);
  }
}

function squareCrop(src, w, h){
  const c = document.createElement('canvas');
  c.width = c.height = SIZE;
  const s = Math.min(w, h);

  return c;
}
function fullCanvas(src, w, h, maxSide = 1024){
  const k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function handleImage(src, w, h){

}

/* ---------------- shared helpers ---------------- */
function drawMap(canvas, act, ch){
  const {data, h, w, c} = act;
  canvas.width = w; canvas.height = h;
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < h*w; i++) { const v = data[i*c+ch]; if (v < min) min = v; if (v > max) max = v; }
  const range = (max - min) || 1;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < h*w; i++) {
    const k = Math.round((data[i*c+ch]-min)/range*255)*3;
    img.data[i*4] = LUT[k]; img.data[i*4+1] = LUT[k+1]; img.data[i*4+2] = LUT[k+2]; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function strongestChannels(act, n){
  const {data, h, w, c} = act;
  const sums = new Float64Array(c);
  for (let i = 0; i < h*w; i++) { const o = i*c; for (let ch = 0; ch < c; ch++) sums[ch] += data[o+ch]; }
  return Array.from(sums.keys()).sort((a,b) => sums[b]-sums[a]).slice(0, Math.min(n, c));
}

function el(tag, cls, text){
  const e = document.createElement(tag);

/* ---------------- run: what is it? ---------------- */
async function runObjects(inputCanvas){
  if (!objModel || !(await startRun())) return;
  try {
    const outs = tf.tidy(() => {
      const x = tf.browser.fromPixels(inputCanvas).toFloat().div(127.5).sub(1).expandDims(0);
      return objModel.predict(x);
    });
    const list = Array.isArray(outs) ? outs : [outs];
    const acts = list.slice(0, -1).map(t => ({data:t.dataSync(), h:t.shape[1], w:t.shape[2], c:t.shape[3]}));
    const probs = list[list.length-1].dataSync();
    tf.dispose(list);
    const top = Array.from(probs.keys()).sort((a,b) => probs[b]-probs[a]).slice(0, 5);
    await showResults({
      kind: 'obj', acts, stages: objStages, netSize: SIZE, inputCanvas,
      chans: acts.map(a => strongestChannels(a, MAPS_PER_LAYER)),
      guess: {probs, top}
    });
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}

// Records every convolution the face network runs, so we can show its real layers.
async function captureAgeNet(faceCanvas){
  const ftf = faceapi.tf;
  const eng = ftf.engine();
  const orig = eng.runKernel;
  const ops = [];
  let inside = false;
  const CONV = new Set(['Conv2D', 'FusedConv2D', 'DepthwiseConv2dNative', 'FusedDepthwiseConv2D']);
  const POOL = new Set(['MaxPool', 'AvgPool']);
  eng.runKernel = function(name, inputs, attrs){
    const out = orig.call(this, name, inputs, attrs);
    if (!inside && (CONV.has(name) || POOL.has(name))) {
      inside = true;
      try {
        const t = Array.isArray(out) ? out[0] : out;
        const x = inputs && inputs.x;
        if (t && t.rank === 4 && x && x.rank === 4) {
          let k = 1;
          if (CONV.has(name) && inputs.filter) k = inputs.filter.shape[0];
          if (POOL.has(name) && attrs) k = Array.isArray(attrs.filterSize) ? attrs.filterSize[0] : (attrs.filterSize || 1);
          const op = {name, k, inW: x.shape[2], outW: t.shape[2], conv: CONV.has(name)};
          if (op.conv) op.t = ftf.keep(ftf.relu(t));
          ops.push(op);
        }
      } finally { inside = false; }
    }
    return out;
  };
  let pred;
  try { pred = await faceapi.nets.ageGenderNet.predictAgeAndGender(faceCanvas); }
  finally { eng.runKernel = orig; }
  if (Array.isArray(pred)) pred = pred[0];

  // How much of the face each square can see (grows layer by layer)
  const netSize = ops.length ? ops[0].inW : FACE_NET_SIZE;
  let rf = 1;
  for (const op of ops) { rf += (op.k - 1) * (netSize / op.inW); op.rf = rf; }

  const convs = ops.filter(o => o.conv);
  const n = Math.min(6, convs.length);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(Math.round(i * (convs.length - 1) / Math.max(1, n - 1)));
  const acts = [], stages = [];
  picked.forEach((ci, j) => {
    const t = convs[ci].t;
    acts.push({data: t.dataSync(), h: t.shape[1], w: t.shape[2], c: t.shape[3]});
    stages.push({n: j + 1, wkey: 'whatAge', wi: Math.round(j * 5 / Math.max(1, n - 1)), rf: convs[ci].rf});
  });
  convs.forEach(o => o.t.dispose());
  return {age: pred ? pred.age : NaN, acts, stages, netSize};
}

async function runAge(srcCanvas){
  if (!faceLoaded || !(await startRun())) return;
  try {
    setStatus(t('sLookingFace'));
    const det = await faceapi.detectSingleFace(srcCanvas, new faceapi.TinyFaceDetectorOptions({inputSize: 416, scoreThreshold: 0.4}));
    if (!det) { setStatus(t('sNoFace'), true); return; }
    const b = det.box;
    const side = Math.max(b.width, b.height) * 1.15;
    const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    const face = document.createElement('canvas');
    face.width = face.height = SIZE;
    const g = face.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, SIZE, SIZE);
    g.drawImage(srcCanvas, cx - side / 2, cy - side / 2, side, side, 0, 0, SIZE, SIZE);
    setStatus(t('sThinking'));
    const r = await captureAgeNet(face);
    if (!isFinite(r.age) || !r.acts.length) throw new Error('No age result');
    await showResults({
      kind: 'age', acts: r.acts, stages: r.stages, netSize: r.netSize, inputCanvas: face,
      chans: r.acts.map(a => strongestChannels(a, MAPS_PER_LAYER)),
      guess: {age: r.age}
    });
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}

/* ---------------- 3D view ---------------- */
const view = {has3D: false, ready: false, visible: false, stale: false};
let mode = '3d';
const GAP = 6, INPUT = 6, RF_COLOR = 0x22D3EE;

function webglOK(){
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch { return false; }
}
view.has3D = !!THREE && webglOK();
if (!view.has3D) { $('seg').hidden = true; mode = 'flat'; }

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function init3D(){
  const box = $('stage3d');
  const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.append(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(6, 10, 8); scene.add(sun);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 0.5;
  controls.addEventListener('start', () => { controls.autoRotate = false; });
  const group = new THREE.Group(); scene.add(group);
  const rfGroup = new THREE.Group(); scene.add(rfGroup);
  Object.assign(view, {renderer, scene, camera, controls, group, rfGroup, pickables: [], ready: true});

  const resize = () => {
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(box);
  resize();

  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY}; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) pick(e);
    down = null;
  });

  const loop = () => {
    requestAnimationFrame(loop);
    if (!view.visible || document.hidden) return;
    controls.update();
    renderer.render(scene, camera);
  };
  loop();
}

function disposeTree(obj){
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
  obj.clear();
}

function makeLabel(lines, height){
  const ink = cssVar('--ink') || '#18233D';
  const muted = cssVar('--muted') || '#56627A';
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  const fonts = [`800 64px ${cssVar('--display')}`, `400 40px ${cssVar('--body')}`];
  g.direction = STR[LANG].dir;
  let w = 0;
  lines.forEach((t, i) => { g.font = fonts[Math.min(i, 1)]; w = Math.max(w, g.measureText(t).width); });
  c.width = Math.ceil(w + 24);
  c.height = lines.length === 1 ? 84 : 140;
  lines.forEach((t, i) => {
    g.font = fonts[Math.min(i, 1)];
    g.fillStyle = i === 0 ? ink : muted;
    g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(t, c.width / 2, i === 0 ? 6 : 82);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false}));
  const hgt = height * (c.height / 84);
  sprite.scale.set(hgt * c.width / c.height, hgt, 1);
  return sprite;
}

function canvasTexture(canvas, pixelated){
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = pixelated ? THREE.NearestFilter : THREE.LinearFilter;
  return tex;
}

function frameCamera(){
  const {camera, controls, group} = view;
  const box = new THREE.Box3().setFromObject(group);
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z));
  const portrait = camera.aspect < 1;
  const dir = (portrait ? new THREE.Vector3(0.45, 0.85, 1) : new THREE.Vector3(0.95, 0.42, 1)).normalize();
  const target = box.getCenter(new THREE.Vector3());
  const place = d => { camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); };
  const bounds = () => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of pts) { const q = p.clone().project(camera); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    return {x0, x1, y0, y1};
  };
  let dist = 40;
  for (let round = 0; round < 3; round++) {
    let lo = 5, hi = 300;
    for (let i = 0; i < 30; i++) {
      dist = (lo + hi) / 2; place(dist);
      const b = bounds();
      if (b.x0 > -0.94 && b.x1 < 0.94 && b.y0 > -0.9 && b.y1 < 0.9) hi = dist; else lo = dist;
    }
    dist = hi; place(dist);
    const b = bounds();
    const mx = (b.x0 + b.x1) / 2, my = (b.y0 + b.y1) / 2;
    const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist, halfW = halfH * camera.aspect;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(right, mx * halfW).addScaledVector(up, my * halfH);
  }
  place(dist);
  controls.target.copy(target);
  controls.maxDistance = dist * 2.5;
  controls.update();
}

async function build3D(){
  const {group, rfGroup} = view;
  disposeTree(group); disposeTree(rfGroup);
  view.pickables = [];
  view.stale = false;
  await document.fonts.ready;
  const {acts, chans, inputCanvas, stages, kind, netSize} = current;

  const inputMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(INPUT, INPUT),
    new THREE.MeshBasicMaterial({map: canvasTexture(inputCanvas, false), side: THREE.DoubleSide})
  );
  group.add(inputMesh);
  const inLabel = makeLabel([inputTitle(kind), t('pixels', {n: netSize})], 0.55);
  inLabel.position.set(0, INPUT / 2 + 0.75, 0);
  group.add(inLabel);

  view.visible = mode === '3d';
  view.controls.autoRotate = false;

  const layerGroups = [];
  acts.forEach((a, s) => {
    const lg = new THREE.Group();
    const z = -(s + 1) * GAP;
    const size = 0.6 + 0.85 * Math.sqrt(Math.min(1, a.w / 112));
    const cols = 4, rows = Math.ceil(chans[s].length / cols), step = size * 1.14;
    chans[s].forEach((ch, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(size, size),
        new THREE.MeshBasicMaterial({map: canvasTexture(drawMap(document.createElement('canvas'), a, ch), true), side: THREE.DoubleSide})
      );
      mesh.position.set((col - (cols - 1) / 2) * step, ((rows - 1) / 2 - row) * step, z);
      mesh.userData = {stage: s, ch, size};
      lg.add(mesh);
      view.pickables.push(mesh);
    });
    const label = makeLabel([stTitle(stages[s]), stWhat(stages[s]) || t('pixels', {n: a.w})], 0.5);
    label.position.set(0, rows * step / 2 + 0.7, z);
    lg.add(label);
    lg.visible = false;
    group.add(lg);
    layerGroups.push(lg);
  });

  // the guess
  const og = new THREE.Group();
  const zOut = -(acts.length + 1.8) * GAP;
  const accent = new THREE.Color(cssVar('--accent') || '#3346D3');
  if (kind === 'age') {
    const age = Math.round(current.guess.age);
    const big = makeLabel([String(age), t('yearsOld')], 2.2);
    big.position.set(0, 0.6, zOut);
    og.add(big);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.6, 0.12, 16, 80),
      new THREE.MeshLambertMaterial({color: accent})
    );
    ring.position.set(0, 0.4, zOut - 0.3);
    og.add(ring);
    const gl = makeLabel([t('guess')], 0.55);
    gl.position.set(0, 3.8, zOut);
    og.add(gl);
  } else {
    const {probs, top} = current.guess;
    top.forEach((idx, i) => {
      const p = probs[idx];
      const h = 0.15 + 4 * p;
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, h, 0.7),
        new THREE.MeshLambertMaterial({color: accent.clone().lerp(new THREE.Color('#9aa6bf'), i === 0 ? 0 : 0.45)})
      );
      const x = (i - 2) * 1.7;
      bar.position.set(x, -2 + h / 2, zOut);
      og.add(bar);
      const lab = makeLabel([labelFor(kind, idx), (p * 100).toFixed(1) + '%'], i === 0 ? 0.42 : 0.3);
      lab.position.set(x, -2 + h + 0.55, zOut);
      og.add(lab);
    });
    const gl = makeLabel([t('guess')], 0.55);
    gl.position.set(0, 3.6, zOut);
    og.add(gl);
  }
  og.visible = false;
  group.add(og);
  layerGroups.push(og);
  frameCamera();

  for (const lg of layerGroups) {
    await sleep(220);
    lg.visible = true;
  }
  if (!reduceMotion) view.controls.autoRotate = true;
}

function clearRF(){ disposeTree(view.rfGroup); }

function pick(e){
  if (!current) return;
  const {camera, renderer} = view;
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(view.pickables, false);
  if (!hits.length || !hits[0].uv) { clearRF(); return; }
  const hit = hits[0];
  const {stage, ch, size} = hit.object.userData;
  const a = current.acts[stage];
  const x = Math.min(a.w - 1, Math.floor(hit.uv.x * a.w));
  const y = Math.min(a.h - 1, Math.floor((1 - hit.uv.y) * a.h));
  showRF(hit.object, stage, ch, size, x, y);
}

function showRF(mesh, s, ch, size, x, y){
  clearRF();
  const a = current.acts[s];
  const N = current.netSize;
  const jump = N / a.w;
  const rf = current.stages[s].rf || jump * 3;
  const cx = (x + 0.5) * jump, cy = (y + 0.5) * jump;
  const x0 = Math.max(0, cx - rf / 2), x1 = Math.min(N, cx + rf / 2);
  const y0 = Math.max(0, cy - rf / 2), y1 = Math.min(N, cy + rf / 2);
  const P = (px, py) => new THREE.Vector3((px / N - 0.5) * INPUT, (0.5 - py / N) * INPUT, 0.03);
  const corners = [P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1)];

  const local = (u, v) => mesh.localToWorld(new THREE.Vector3(u * size - size / 2, size / 2 - v * size, 0.03));
  const cc = local((x + 0.5) / a.w, (y + 0.5) / a.h);
  const sq = [local(x / a.w, y / a.h), local((x + 1) / a.w, y / a.h), local((x + 1) / a.w, (y + 1) / a.h), local(x / a.w, (y + 1) / a.h)];

  const pts = [];
  corners.forEach(c => pts.push(cc, c));
  for (let i = 0; i < 4; i++) pts.push(corners[i], corners[(i + 1) % 4]);
  for (let i = 0; i < 4; i++) pts.push(sq[i], sq[(i + 1) % 4]);
  view.rfGroup.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: RF_COLOR})
  ));

  const fill = new THREE.Mesh(
    new THREE.PlaneGeometry((x1 - x0) / N * INPUT, (y1 - y0) / N * INPUT),
    new THREE.MeshBasicMaterial({color: RF_COLOR, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false})
  );
  fill.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2));
  view.rfGroup.add(fill);
  view.controls.autoRotate = false;

  const whole = (x1 - x0) >= N - 1 && (y1 - y0) >= N - 1;
  setStatus(t(whole ? 'rfWhole' : 'rfPart', {t: stTitle(current.stages[s])}));
}

  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});


/* ---------------- draw a number or a shape ---------------- */
let drawModel = null, drawViz = null;
async function ensureDraw(){
  if (drawViz) return;
  const bin = atob(DRAW_MODEL.weightData);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  drawModel = await tf.loadLayersModel(tf.io.fromMemory({modelTopology: DRAW_MODEL.modelTopology, weightSpecs: DRAW_MODEL.weightSpecs, weightData: buf.buffer}));
  const outs = DRAW_STAGES.map(st => drawModel.getLayer(st.name).output);
  outs.push(drawModel.outputs[0]);
  drawViz = tf.model({inputs: drawModel.inputs, outputs: outs});
}

const pad = $('padCanvas'), pctx = pad.getContext('2d');
let drawing = false, last = null, inked = false, liveTimer = null;
function clearPad(){
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, pad.width, pad.height);
  inked = false; $('live').textContent = t('liveEmpty');
}
clearPad();
function padPoint(e){
  const r = pad.getBoundingClientRect();
  return {x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height};
}
pad.addEventListener('pointerdown', e => { drawing = true; last = padPoint(e); pad.setPointerCapture(e.pointerId); stroke(last, last); });
pad.addEventListener('pointermove', e => { if (!drawing) return; const p = padPoint(e); stroke(last, p); last = p; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => pad.addEventListener(ev, () => {
  if (!drawing) return; drawing = false;
  clearTimeout(liveTimer); liveTimer = setTimeout(liveGuess, 150);
}));
function stroke(a, b){
  pctx.strokeStyle = '#fff'; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.lineWidth = pad.width * 0.065;
  pctx.beginPath(); pctx.moveTo(a.x, a.y); pctx.lineTo(b.x, b.y); pctx.stroke();
  inked = true;
}
// Turn the drawing into a 28 x 28 picture, the same way the training pictures were made
function drawingTo28(){
  const W = pad.width, H = pad.height;
  const d = pctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4] > 30) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = 20 / Math.max(w, h);
  const nw = Math.max(1, Math.round(w * k)), nh = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas'); c.width = c.height = 28;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 28, 28);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(pad, x0, y0, w, h, Math.floor((28 - nw) / 2), Math.floor((28 - nh) / 2), nw, nh);
  const px = g.getImageData(0, 0, 28, 28).data;
  const v = new Float32Array(784);
  let tot = 0, cx = 0, cy = 0;
  for (let i = 0; i < 784; i++) { v[i] = px[i * 4] / 255; tot += v[i]; cx += v[i] * (i % 28); cy += v[i] * Math.floor(i / 28); }
  const dx = Math.round(13.5 - cx / tot), dy = Math.round(13.5 - cy / tot);
  const out = new Float32Array(784);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    const sx = x - dx, sy = y - dy;
    if (sx >= 0 && sx < 28 && sy >= 0 && sy < 28) out[y * 28 + x] = v[sy * 28 + sx];
  }
  return out;
}
function liveGuess(){
  if (!drawModel || !inked) return;
  const v = drawingTo28(); if (!v) return;
  const p = tf.tidy(() => drawModel.predict(tf.tensor4d(v, [1, 28, 28, 1])).dataSync());
  let best = 0; for (let i = 1; i < p.length; i++) if (p[i] > p[best]) best = i;
  $('live').textContent = t('liveGuess', {x: t('drawLabels')[best]});
}
async function runDraw(){
  if (!drawViz) return;
  if (!inked) { setStatus(t('sDrawFirst'), true); return; }
  const v = drawingTo28(); if (!v) { setStatus(t('sDrawFirst'), true); return; }
  if (!(await startRun())) return;
  try {
    const outs = tf.tidy(() => drawViz.predict(tf.tensor4d(v, [1, 28, 28, 1])));
    const acts = outs.slice(0, -1).map(tt => ({data: tt.dataSync(), h: tt.shape[1], w: tt.shape[2], c: tt.shape[3]}));
    const probs = outs[outs.length - 1].dataSync();
    tf.dispose(outs);
    const top = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]).slice(0, 5);
    // show the 28 x 28 picture big and blocky
    const small = document.createElement('canvas'); small.width = small.height = 28;
    const sg = small.getContext('2d'), img = sg.createImageData(28, 28);
    for (let i = 0; i < 784; i++) { const g = Math.round(v[i] * 255); img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = g; img.data[i*4+3] = 255; }
    sg.putImageData(img, 0, 0);
    const inputCanvas = document.createElement('canvas'); inputCanvas.width = inputCanvas.height = SIZE;
    const ig = inputCanvas.getContext('2d'); ig.imageSmoothingEnabled = false; ig.drawImage(small, 0, 0, SIZE, SIZE);
    await showResults({
      kind: 'draw', acts, stages: DRAW_STAGES, netSize: 28, inputCanvas,
      chans: acts.map(a => strongestChannels(a, MAPS_PER_LAYER)),
      guess: {probs, top}
    });
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}
$('padClear').addEventListener('click', clearPad);
$('seeInside').addEventListener('click', runDraw);

/* ---------------- language ---------------- */
function applyLang(l){
  LANG = STR[l] ? l : 'en';
  try { localStorage.setItem('cnnDemoLang', LANG); } catch {}
  const root = document.documentElement;
  root.lang = LANG; root.dir = STR[LANG].dir;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(n => { n.innerHTML = t(n.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', t(n.dataset.i18nAria)); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  applyModeText();
  if (!inked) $('live').textContent = t('liveEmpty'); else liveGuess();
  if (!busy) {
    const ready = appMode === 'obj' ? !!objModel : appMode === 'age' ? faceLoaded : !!drawModel;
    if (ready) readyStatus();
    else if (appMode === 'obj') setStatus(t('sGettingReady'));
  }
  if (current) {
    buildGuess(); buildFlat();
    if (view.ready && mode === '3d') build3D(); else view.stale = true;
  }
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

applyLang(pickLang());
initObjects();
