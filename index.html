/* ---------------- app mode: what is it / how old ---------------- */
function applyModeText(){
  if (!appMode) { $('lede').textContent = ''; return; }
  $('lede').textContent = t(appMode === 'age' ? 'ledeAge' : appMode === 'draw' ? 'ledeDraw' : 'ledeObj');
}
async function setAppMode(m){
  if (m === appMode || busy) return;
  appMode = m;
  closeCamera();
  ['lede', 'status'].forEach(id => { $(id).hidden = false; });
  document.querySelector('main').classList.add('picked');
  ['obj', 'age', 'draw'].forEach(k => $('mode' + k.charAt(0).toUpperCase() + k.slice(1)).setAttribute('aria-pressed', k === m));
  $('pattern').hidden = true;
  buildSamples();
  $('drop').hidden = m === 'draw';
  $('pad').hidden = m !== 'draw';
  document.querySelector('main').classList.toggle('drawing', m === 'draw');
  applyModeText();
  $('results').hidden = true;
  current = null;
  if (m === 'obj') {
    if (objModel) { readyStatus(); setButtons(true); }
    else { setStatus(t('sGettingReady')); setButtons(false); }
    return;
  }
  if (m === 'draw') {
    try { await ensureDraw(); readyStatus(); setButtons(true); }
    catch (e) { console.error(e); setStatus(t('sLoadFail'), true); }
    return;
  }
  if (faceLoaded) { readyStatus(); setButtons(true); return; }
  setStatus(t('sFaceLoading')); setButtons(false);
  try {
    await ensureFace();
    if (appMode === 'age') { readyStatus(); setButtons(true); }
  } catch {
    if (appMode === 'age') setStatus(t('sFaceFail'), true);
  }
}

/* ---------------- draw a number or a shape ---------------- */
let drawModel = null, drawViz = null;
async function ensureDraw(){
  if (drawViz) return;
  const bin = atob(DRAW_MODEL.weightData);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  drawModel = await tf.loadLayersModel(tf.io.fromMemory({modelTopology: DRAW_MODEL.modelTopology, weightSpecs: DRAW_MODEL.weightSpecs, weightData: buf.buffer}));
  const outs = DRAW_STAGES.map(st => drawModel.getLayer(st.name).output);
  outs.push(drawModel.outputs[0]);
  drawViz = tf.model({inputs: drawModel.inputs, outputs: outs});
  drawFull = tf.model({inputs: drawModel.inputs, outputs: NET_KEYS.map(k => drawModel.getLayer(k).output)});
}
const NET_KEYS = ['c1', 'p1', 'c2', 'p2', 'c3', 'fc', 'out'];
let drawFull = null;
function drawForward(v){
  const outs = tf.tidy(() => drawFull.predict(tf.tensor4d(v, [1, 28, 28, 1])));
  const F = {in: {data: v, h: 28, w: 28, c: 1}};
  NET_KEYS.forEach((k, i) => {
    const tt = outs[i];
    F[k] = tt.shape.length === 4 ? {data: tt.dataSync(), h: tt.shape[1], w: tt.shape[2], c: tt.shape[3]} : {data: tt.dataSync()};
  });
  tf.dispose(outs);
  return F;
}
function drawResult(v){
  const F = drawForward(v);
  const probs = F.out.data;
  const top = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]).slice(0, 5);
  const small = document.createElement('canvas'); small.width = small.height = 28;
  const sg = small.getContext('2d'), img = sg.createImageData(28, 28);
  for (let i = 0; i < 784; i++) { const g = Math.round(v[i] * 255); img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = g; img.data[i*4+3] = 255; }
  sg.putImageData(img, 0, 0);
  const inputCanvas = document.createElement('canvas'); inputCanvas.width = inputCanvas.height = SIZE;
  const ig = inputCanvas.getContext('2d'); ig.imageSmoothingEnabled = false; ig.drawImage(small, 0, 0, SIZE, SIZE);
  const acts = [F.c1, F.p1, F.c2, F.p2, F.c3];
  return {kind: 'draw', acts, stages: DRAW_STAGES, netSize: 28, inputCanvas, net: F,
    chans: acts.map(a => strongestChannels(a, MAPS_PER_LAYER)), guess: {probs, top}};
}

const pad = $('padCanvas'), pctx = pad.getContext('2d');
let drawing = false, last = null, inked = false, liveTimer = null;
function clearPad(){
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, pad.width, pad.height);
  inked = false; $('live').textContent = t('liveEmpty');
}
clearPad();
function padPoint(e){
  const r = pad.getBoundingClientRect();
  return {x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height};
}
pad.addEventListener('pointerdown', e => { drawing = true; last = padPoint(e); pad.setPointerCapture(e.pointerId); stroke(last, last); });
pad.addEventListener('pointermove', e => { if (!drawing) return; const p = padPoint(e); stroke(last, p); last = p; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => pad.addEventListener(ev, () => {
  if (!drawing) return; drawing = false;
  clearTimeout(liveTimer); liveTimer = setTimeout(liveGuess, 150);
}));
function stroke(a, b){
  pctx.strokeStyle = '#fff'; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.lineWidth = pad.width * 0.065;
  pctx.beginPath(); pctx.moveTo(a.x, a.y); pctx.lineTo(b.x, b.y); pctx.stroke();
  inked = true;
}
// Turn the drawing into a 28 x 28 picture, the same way the training pictures were made
function drawingTo28(){
  const W = pad.width, H = pad.height;
  const d = pctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4] > 30) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = 20 / Math.max(w, h);
  const nw = Math.max(1, Math.round(w * k)), nh = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas'); c.width = c.height = 28;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 28, 28);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(pad, x0, y0, w, h, Math.floor((28 - nw) / 2), Math.floor((28 - nh) / 2), nw, nh);
  const px = g.getImageData(0, 0, 28, 28).data;
  const v = new Float32Array(784);
  let tot = 0, cx = 0, cy = 0;
  for (let i = 0; i < 784; i++) { v[i] = px[i * 4] / 255; tot += v[i]; cx += v[i] * (i % 28); cy += v[i] * Math.floor(i / 28); }
  const dx = Math.round(13.5 - cx / tot), dy = Math.round(13.5 - cy / tot);
  const out = new Float32Array(784);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    const sx = x - dx, sy = y - dy;
    if (sx >= 0 && sx < 28 && sy >= 0 && sy < 28) out[y * 28 + x] = v[sy * 28 + sx];
  }
  return out;
}
function liveGuess(){
  if (!drawModel || !inked) return;
  const v = drawingTo28(); if (!v) return;
  const p = tf.tidy(() => drawModel.predict(tf.tensor4d(v, [1, 28, 28, 1])).dataSync());
  let best = 0; for (let i = 1; i < p.length; i++) if (p[i] > p[best]) best = i;
  $('live').textContent = t('liveGuess', {x: t('drawLabels')[best]});
  if ((!current || current.kind !== 'draw') && !busy && drawFull) { runDraw({auto: true}); return; }
  if (current && current.kind === 'draw' && !busy && drawFull) {
    const res = nameStages(drawResult(v));
    current = res;
    buildGuess(); buildFlat();
    if (view.ready && mode === '3d') applySub();
    else view.stale = true;
  }
}
async function runDraw(opts = {}){
  if (!drawViz) return;
  if (!inked) { setStatus(t('sDrawFirst'), true); return; }
  const v = drawingTo28(); if (!v) { setStatus(t('sDrawFirst'), true); return; }
  if (!(await startRun())) return;
  try {
    await showResults(drawResult(v), {noScroll: !!opts.auto});
  } catch (e) {
    console.error(e);
    setStatus(t('sWrong'), true);
  } finally { endRun(); }
}
$('padClear').addEventListener('click', clearPad);
$('seeInside').addEventListener('click', runDraw);



/* ---------------- the little picture next to the title changes every round ---------------- */
(function heroPictures(){
  const art = document.querySelector('.hero-art'); if (!art) return;
  const px = [...art.querySelectorAll('.px')], outs = [...art.querySelectorAll('.ox')], win = art.querySelector('.win');
  if (px.length !== 49 || outs.length !== 9 || !win) return;
  const PICS = [
    [['0011100', '0111110', '1101011', '1111111', '1011101', '0100010', '0011100'], '🙂'],
    [['0110110', '1111111', '1111111', '1111111', '0111110', '0011100', '0001000'], '❤️'],
    [['0111110', '0000010', '0000010', '0011110', '0000010', '0000010', '0111110'], '3'],
    [['0001000', '0011100', '0111110', '1111111', '0110110', '0110110', '0110110'], '🏠'],
    [['0001000', '0001000', '1111111', '0111110', '0011100', '0110110', '0100010'], '⭐'],
    [['0111110', '0000010', '0000100', '0001000', '0001000', '0010000', '0010000'], '7'],
    [['1000001', '1100011', '1111111', '1011101', '1111111', '1110111', '0111110'], '🐱']
  ];
  const guessT = art.querySelector('.guess-t'), guessG = art.querySelector('.guess');
  let revealTimer = null, revealAt = 0, revealFn = null, pausedLeft = null;
  window.__heroPause = on => {
    if (on) { pausedLeft = Math.max(0, revealAt - performance.now()); clearTimeout(revealTimer); }
    else if (pausedLeft !== null && revealFn) { revealAt = performance.now() + pausedLeft; revealTimer = setTimeout(revealFn, pausedLeft); pausedLeft = null; }
  };
  let k = 0;
  const show = (item, keepGuess) => {
    const [pic, answer] = item;
    const ltr = document.documentElement.dir !== 'rtl';
    if (!keepGuess) {
      // the guess: "?" while the window is looking, then the answer near the end of the round
      clearTimeout(revealTimer);
      guessT.textContent = '?'; guessG.classList.remove('pop');
      revealAt = performance.now() + (reduceMotion ? 0 : 7600); revealFn = () => { guessT.textContent = answer; guessG.classList.add('pop'); };
      revealTimer = setTimeout(revealFn, revealAt - performance.now());
    }
    px.forEach((r, i) => {
      const on = pic[Math.floor(i / 7)][i % 7] === '1';
      r.setAttribute('fill', on ? 'var(--ink)' : 'var(--line)');
      r.setAttribute('opacity', on ? 1 : 0.55);
    });
    // each result square = how much of the picture the window saw at that spot
    outs.forEach((r, i) => {
      const R = Math.floor(i / 3), Cc = i % 3;
      let n = 0;
      for (let y = 2 * R; y < 2 * R + 3; y++) for (let x = 2 * Cc; x < 2 * Cc + 3; x++) n += pic[y][ltr ? 6 - x : x] === '1' ? 1 : 0;
      r.setAttribute('fill', n >= 5 ? 'var(--ink)' : n >= 3 ? 'color-mix(in srgb, var(--ink) 45%, var(--line))' : 'var(--line)');
    });
  };
  show(PICS[0]);
  win.addEventListener('animationiteration', () => { k = (k + 1) % PICS.length; show(PICS[k]); });
  new MutationObserver(() => show(PICS[k], true)).observe(document.documentElement, {attributes: true, attributeFilter: ['dir']});
})();

/* ---------------- a magnifying glass over the title (mouse only) ---------------- */
(function titleLens(){
  const wrap = document.querySelector('.title-wrap'); if (!wrap) return;
  const h1 = wrap.querySelector('h1'), lens = wrap.querySelector('.lens'), inner = wrap.querySelector('.lens-in');
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const Z = 1.7, R = 72;
  h1.addEventListener('pointerenter', () => {
    const cs = getComputedStyle(h1);
    inner.innerHTML = h1.innerHTML;
    Object.assign(inner.style, {width: h1.clientWidth + 'px', font: cs.font, lineHeight: cs.lineHeight, letterSpacing: cs.letterSpacing, color: cs.color, textAlign: cs.textAlign, direction: cs.direction});
    lens.classList.add('on');
  });
  h1.addEventListener('pointerleave', () => lens.classList.remove('on'));
  h1.addEventListener('pointermove', e => {
    const r = h1.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    lens.style.left = (e.clientX - wr.left - R) + 'px';
    lens.style.top = (e.clientY - wr.top - R) + 'px';
    inner.style.transform = `translate(${R - mx * Z}px, ${R - my * Z}px) scale(${Z})`;
  });
})();

/* ---------------- language ---------------- */
function applyLang(l){
  LANG = STR[l] ? l : 'en';
  try { localStorage.setItem('cnnDemoLang', LANG); } catch {}
  const root = document.documentElement;
  root.lang = LANG; root.dir = STR[LANG].dir;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(n => { n.innerHTML = t(n.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', t(n.dataset.i18nAria)); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  applyModeText();
  buildSamples();
  $('pauseTxt').textContent = t(view.paused ? 'resume' : 'pause');
  if (!inked) $('live').textContent = t('liveEmpty'); else liveGuess();
  if (!busy) {
    const ready = appMode === 'obj' ? !!objModel : appMode === 'age' ? faceLoaded : !!drawModel;
    if (ready) readyStatus();
    else if (appMode === 'obj') setStatus(t('sGettingReady'));
    else if (!appMode) statusEl.textContent = '';
  }
  if (current) {
    buildGuess(); buildFlat();
    if (view.ready && mode === '3d') build3D().then(applySub); else view.stale = true;
  }
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
